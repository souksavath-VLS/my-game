<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔍 Spot the Difference · จับผิดภาพ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    background: linear-gradient(180deg, #0c4a6e, #082f49);
    color: #e0f2fe;
    font-family: 'Noto Sans Lao', 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  .sd-wrap {
    max-width: 900px; margin: 0 auto;
    display: flex; flex-direction: column;
    height: 100dvh; padding: 6px;
  }

  /* Header */
  .sd-header {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: linear-gradient(135deg, rgba(14,165,233,0.6), rgba(59,130,246,0.6));
    padding: 8px 12px; border-radius: 12px;
    margin-bottom: 6px;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .sd-exit {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(220,38,38,0.8); color: #fff;
    text-decoration: none; font-weight: 900; font-size: 0.9rem;
    border: 1px solid rgba(255,255,255,0.2);
    flex-shrink: 0;
  }
  .sd-title {
    font-size: 1rem; font-weight: 900;
    letter-spacing: 0.3px; text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    text-align: center; flex: 1;
  }
  .sd-level-btn {
    background: rgba(15,23,42,0.75); color: #facc15;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 10px; border-radius: 20px;
    font-weight: 800; font-size: 0.85rem; font-family: inherit;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    flex-shrink: 0;
  }
  .sd-level-btn:active { transform: scale(0.95); }

  /* Stat bar */
  .sd-stats {
    flex: 0 0 auto;
    display: flex; gap: 6px; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .sd-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(15,23,42,0.65); padding: 6px 12px;
    border-radius: 20px; font-weight: 700; font-size: 0.85rem;
    border: 1px solid rgba(255,255,255,0.12);
    min-height: 36px;
  }
  .sd-chip .val { color: #facc15; font-size: 0.95rem; font-weight: 900; }
  .sd-chip.hearts { color: #fca5a5; letter-spacing: 2px; font-size: 0.95rem; }
  .sd-chip.found { color: #86efac; }
  .sd-hint-btn {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #fff; border: none; padding: 8px 14px;
    border-radius: 20px; font-weight: 800; font-size: 0.85rem;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(146,64,14,0.7);
    font-family: inherit;
    min-height: 36px;
  }
  .sd-hint-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .sd-hint-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(146,64,14,0.7); }
  .sd-restart-btn {
    background: linear-gradient(135deg, #06b6d4, #0284c7);
    color: #fff; border: none; padding: 8px 14px;
    border-radius: 20px; font-weight: 800; font-size: 0.85rem;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(3,105,161,0.7);
    font-family: inherit;
    min-height: 36px;
  }
  .sd-restart-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(3,105,161,0.7); }

  /* Scenes */
  .sd-scenes {
    flex: 1; min-height: 0;
    display: flex; gap: 8px;
  }
  .sd-panel {
    flex: 1;
    background: rgba(15,23,42,0.4);
    border: 3px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 4px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }
  .sd-panel-label {
    position: absolute; top: 6px; left: 8px;
    background: rgba(15,23,42,0.75);
    color: #facc15; font-weight: 900; font-size: 0.75rem;
    padding: 2px 8px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    pointer-events: none; z-index: 2;
  }
  .sd-panel svg {
    max-width: 100%; max-height: 100%;
    width: 100%; height: 100%;
    display: block;
    cursor: crosshair;
  }

  /* Feedback circles */
  .sd-found {
    stroke: #22c55e; stroke-width: 4;
    fill: none; opacity: 0;
    animation: sdPop 0.4s ease-out forwards;
    filter: drop-shadow(0 0 6px rgba(34, 197, 94, 0.9));
  }
  @keyframes sdPop {
    0% { transform: scale(2); opacity: 0; }
    50% { transform: scale(0.85); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .sd-hint-mark {
    stroke: #facc15; stroke-width: 3; stroke-dasharray: 6 4;
    fill: none; opacity: 0.9;
    animation: sdHintPulse 1.2s ease-in-out 2;
  }
  @keyframes sdHintPulse {
    0%, 100% { transform: scale(1); opacity: 0.4; }
    50% { transform: scale(1.2); opacity: 1; }
  }
  .sd-wrong-mark {
    stroke: #ef4444; stroke-width: 4; fill: none;
    animation: sdWrongFade 0.6s ease-out forwards;
  }
  @keyframes sdWrongFade {
    0% { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  /* Modal */
  .sd-modal {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center; justify-content: center;
    padding: 16px;
  }
  .sd-modal.show { display: flex; }
  .sd-card {
    background: linear-gradient(145deg, #0f172a, #082f49);
    border: 2px solid #22d3ee;
    border-radius: 20px;
    padding: 24px 22px;
    max-width: 420px; width: 100%;
    max-height: 90vh; overflow-y: auto;
    text-align: center;
    box-shadow: 0 0 40px rgba(34, 211, 238, 0.5);
    animation: sdCardIn 0.4s ease-out;
  }
  @keyframes sdCardIn {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .sd-card h2 {
    font-size: 1.4rem;
    background: linear-gradient(90deg, #22d3ee, #a78bfa, #facc15);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .sd-card p { color: #cbd5e1; margin: 8px 0; line-height: 1.5; }
  .sd-card .stats-row {
    display: flex; justify-content: space-around;
    margin: 14px 0; padding: 10px;
    background: rgba(0,0,0,0.35);
    border-radius: 12px;
  }
  .sd-card .stat { text-align: center; }
  .sd-card .stat .num { display: block; font-size: 1.4rem; font-weight: 900; color: #facc15; }
  .sd-card .stat .lbl { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
  .sd-card-btn {
    display: inline-block;
    padding: 12px 22px; font-size: 0.95rem; font-weight: 800;
    background: linear-gradient(135deg, #06b6d4, #6366f1);
    color: #fff; border: none; border-radius: 12px;
    cursor: pointer; margin: 4px;
    box-shadow: 0 4px 0 rgba(20,60,120,0.6);
    font-family: inherit;
  }
  .sd-card-btn.secondary {
    background: rgba(255,255,255,0.10);
    box-shadow: 0 4px 0 rgba(40,40,80,0.55);
  }
  .sd-card-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(20,60,120,0.6); }
  .sd-emoji { font-size: 3rem; margin-bottom: 4px; animation: sdBounce 1s ease-in-out infinite; }
  @keyframes sdBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* Level select modal */
  .sd-level-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin: 12px 0;
    max-height: 55vh;
    overflow-y: auto;
    padding: 4px;
  }
  .sd-lvl-cell {
    aspect-ratio: 1 / 1;
    background: rgba(15,23,42,0.7);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    color: #cbd5e1;
    font-weight: 900; font-size: 0.85rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
    position: relative;
  }
  .sd-lvl-cell.unlocked { color: #22d3ee; border-color: rgba(34,211,238,0.5); }
  .sd-lvl-cell.completed { background: rgba(34,197,94,0.25); color: #86efac; border-color: rgba(34,197,94,0.6); }
  .sd-lvl-cell.current { background: rgba(250,204,21,0.30); color: #fef3c7; border-color: #facc15; box-shadow: 0 0 10px rgba(250,204,21,0.5); }
  .sd-lvl-cell.locked { opacity: 0.4; cursor: not-allowed; }
  .sd-lvl-cell:disabled { cursor: not-allowed; }
  .sd-scene-badge {
    display: inline-block;
    background: rgba(0,0,0,0.35);
    color: #a5b4fc;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    margin: 4px 2px;
    font-weight: 700;
  }

  /* Landscape phones — side-by-side */
  @media (orientation: landscape) {
    .sd-scenes { flex-direction: row; }
  }
  /* Portrait phones — stacked */
  @media (orientation: portrait) {
    .sd-scenes { flex-direction: column; }
    .sd-panel svg { max-height: 100%; }
  }
  @media (max-width: 420px) {
    .sd-title { font-size: 0.88rem; }
    .sd-chip { padding: 4px 10px; font-size: 0.75rem; min-height: 32px; }
    .sd-hint-btn, .sd-restart-btn { padding: 6px 10px; font-size: 0.75rem; min-height: 32px; }
    .sd-panel-label { font-size: 0.65rem; padding: 1px 6px; }
    .sd-level-btn { font-size: 0.75rem; padding: 4px 8px; }
    .sd-level-grid { grid-template-columns: repeat(5, 1fr); }
  }
</style>
</head>
<body>
  <div class="sd-wrap">
    <div class="sd-header">
      <a href="index.html" class="sd-exit" aria-label="Exit">✕</a>
      <div class="sd-title" id="sd-title">🔍 Spot the Difference</div>
      <button class="sd-level-btn" id="sd-level-btn">
        <span id="sd-level-lbl">Lv</span> <span id="sd-level-num">1</span>/100
      </button>
    </div>

    <div class="sd-stats">
      <div class="sd-chip hearts" id="sd-hearts">❤️❤️❤️❤️❤️</div>
      <div class="sd-chip found">
        <span id="sd-found-label">Found</span>:
        <span class="val"><span id="sd-found">0</span>/<span id="sd-total">5</span></span>
      </div>
      <button class="sd-hint-btn" id="sd-hint-btn">💡 <span id="sd-hint-label">Hint</span> (<span id="sd-hint-count">3</span>)</button>
      <button class="sd-restart-btn" id="sd-restart-btn">🔄 <span id="sd-restart-label">Restart</span></button>
    </div>

    <div class="sd-scenes">
      <div class="sd-panel">
        <div class="sd-panel-label">A</div>
        <div id="scene-a" style="width:100%;height:100%;"></div>
      </div>
      <div class="sd-panel">
        <div class="sd-panel-label">B</div>
        <div id="scene-b" style="width:100%;height:100%;"></div>
      </div>
    </div>
  </div>

  <!-- Win modal -->
  <div class="sd-modal" id="sd-modal-win">
    <div class="sd-card">
      <div class="sd-emoji">🏆</div>
      <h2 id="sd-win-title">Level Complete!</h2>
      <p id="sd-win-sub">Amazing eyes!</p>
      <div class="stats-row">
        <div class="stat"><span class="num" id="sd-win-lvl">1</span><span class="lbl" id="sd-lbl-lvl">Level</span></div>
        <div class="stat"><span class="num" id="sd-win-hearts">5</span><span class="lbl" id="sd-lbl-hearts">Hearts</span></div>
        <div class="stat"><span class="num" id="sd-win-hints">3</span><span class="lbl" id="sd-lbl-hints">Hints</span></div>
      </div>
      <button class="sd-card-btn" id="sd-next-btn"><span id="sd-next-label">Next Level →</span></button>
      <button class="sd-card-btn secondary" id="sd-win-replay"><span id="sd-replay-label">🔄 Replay</span></button>
    </div>
  </div>

  <!-- Lose modal -->
  <div class="sd-modal" id="sd-modal-lose">
    <div class="sd-card">
      <div class="sd-emoji">💔</div>
      <h2 id="sd-lose-title">Out of Hearts!</h2>
      <p id="sd-lose-sub">Try again — you'll get it!</p>
      <div class="stats-row">
        <div class="stat"><span class="num" id="sd-lose-found">0</span><span class="lbl" id="sd-lbl-found">Found</span></div>
      </div>
      <button class="sd-card-btn" id="sd-play-again2"><span id="sd-again-label2">▶ Try Again</span></button>
    </div>
  </div>

  <!-- Game complete modal -->
  <div class="sd-modal" id="sd-modal-all-done">
    <div class="sd-card">
      <div class="sd-emoji">🎊</div>
      <h2 id="sd-all-title">All 100 Levels Complete!</h2>
      <p id="sd-all-sub">You are the ultimate spotter!</p>
      <button class="sd-card-btn" id="sd-all-replay"><span id="sd-restart-all">🔄 Play Again</span></button>
    </div>
  </div>

  <!-- Level select modal -->
  <div class="sd-modal" id="sd-modal-level">
    <div class="sd-card">
      <h2 id="sd-lvl-title">📋 Select Level</h2>
      <div>
        <span class="sd-scene-badge">🌊 <span id="badge-1">1-20</span></span>
        <span class="sd-scene-badge">🚀 <span id="badge-2">21-40</span></span>
        <span class="sd-scene-badge">🌴 <span id="badge-3">41-60</span></span>
        <span class="sd-scene-badge">🐄 <span id="badge-4">61-80</span></span>
        <span class="sd-scene-badge">🏙️ <span id="badge-5">81-100</span></span>
      </div>
      <div class="sd-level-grid" id="sd-level-grid"></div>
      <button class="sd-card-btn secondary" id="sd-level-close"><span id="sd-close-label">Close</span></button>
    </div>
  </div>

<script>
(() => {
  'use strict';

  // ============================================================
  // i18n
  // ============================================================
  const I18N = {
    th: {
      title: '🔍 จับผิดภาพ', level: 'ด่าน',
      found: 'พบแล้ว', hint: 'คำใบ้', restart: 'เริ่มใหม่',
      winTitle: '🎉 ผ่านด่านแล้ว!', winSub: 'สายตายอดเยี่ยม!',
      loseTitle: '💔 หัวใจหมดแล้ว', loseSub: 'ลองใหม่นะ!',
      heartsLeft: 'หัวใจ', hintsLeft: 'คำใบ้', lvLbl: 'ด่าน',
      foundLbl: 'ที่พบ', nextLvl: 'ด่านต่อไป →', replay: '🔄 เล่นซ้ำ',
      tryAgain: '▶ ลองอีกครั้ง', allDone: '🎊 ผ่านครบ 100 ด่าน!',
      allDoneSub: 'คุณคือสุดยอดนักสังเกต!', playAgain: '🔄 เล่นใหม่',
      selectLevel: '📋 เลือกด่าน', close: 'ปิด'
    },
    en: {
      title: '🔍 Spot the Difference', level: 'Lv',
      found: 'Found', hint: 'Hint', restart: 'Restart',
      winTitle: '🎉 Level Complete!', winSub: 'Amazing eyes!',
      loseTitle: '💔 Out of Hearts!', loseSub: "Try again — you'll get it!",
      heartsLeft: 'Hearts', hintsLeft: 'Hints', lvLbl: 'Level',
      foundLbl: 'Found', nextLvl: 'Next Level →', replay: '🔄 Replay',
      tryAgain: '▶ Try Again', allDone: '🎊 All 100 Levels Complete!',
      allDoneSub: 'You are the ultimate spotter!', playAgain: '🔄 Play Again',
      selectLevel: '📋 Select Level', close: 'Close'
    },
    lao: {
      title: '🔍 ຊອກຫາຄວາມແຕກຕ່າງ', level: 'ດ່ານ',
      found: 'ພົບແລ້ວ', hint: 'ຄຳໃບ້', restart: 'ເລີ່ມໃໝ່',
      winTitle: '🎉 ຜ່ານດ່ານແລ້ວ!', winSub: 'ຕາເກັ່ງຫຼາຍ!',
      loseTitle: '💔 ຫົວໃຈໝົດແລ້ວ', loseSub: 'ລອງໃໝ່ເດີ້!',
      heartsLeft: 'ຫົວໃຈ', hintsLeft: 'ຄຳໃບ້', lvLbl: 'ດ່ານ',
      foundLbl: 'ພົບແລ້ວ', nextLvl: 'ດ່ານຕໍ່ໄປ →', replay: '🔄 ຫຼິ້ນຄືນ',
      tryAgain: '▶ ລອງອີກ', allDone: '🎊 ຜ່ານຄົບ 100 ດ່ານ!',
      allDoneSub: 'ເຈົ້າຄືສຸດຍອດ!', playAgain: '🔄 ຫຼິ້ນໃໝ່',
      selectLevel: '📋 ເລືອກດ່ານ', close: 'ປິດ'
    }
  };
  function getLang() {
    let l = localStorage.getItem('lang') || 'en';
    if (!['th','en','lao'].includes(l)) l = 'en';
    return l;
  }
  const lang = getLang();
  const T = I18N[lang];

  // ============================================================
  // Audio
  // ============================================================
  let audioCtx = null, master = null;
  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        master = audioCtx.createGain();
        master.gain.value = 0.35;
        master.connect(audioCtx.destination);
      } catch {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, dur, type, gain, freqEnd) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, now);
    if (freqEnd != null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), now + dur);
    g.gain.setValueAtTime(gain || 0.2, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(g); g.connect(master);
    osc.start(now); osc.stop(now + dur + 0.02);
  }
  const SFX = {
    correct() { ensureAudio(); tone(660, 0.10, 'triangle', 0.30, 990); setTimeout(() => tone(880, 0.14, 'triangle', 0.28, 1320), 90); },
    wrong()   { ensureAudio(); tone(220, 0.15, 'sawtooth', 0.28, 130); setTimeout(() => tone(170, 0.18, 'sawtooth', 0.24, 100), 100); },
    hint()    { ensureAudio(); tone(1200, 0.08, 'sine', 0.20, 800); setTimeout(() => tone(1000, 0.12, 'sine', 0.20, 600), 80); },
    win()     { ensureAudio(); [523,659,784,1046,1319].forEach((f, i) => setTimeout(() => tone(f, 0.20, 'triangle', 0.32), i * 110)); },
    lose()    { ensureAudio(); tone(300, 0.20, 'sawtooth', 0.30, 200); setTimeout(() => tone(220, 0.30, 'sawtooth', 0.28, 150), 200); setTimeout(() => tone(160, 0.50, 'sawtooth', 0.26, 100), 500); }
  };

  // ============================================================
  // Deterministic RNG (level number → same content)
  // ============================================================
  function mulberry32(seed) {
    return function () {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pickN(arr, n, rng) {
    // Fisher-Yates partial shuffle
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a.slice(0, n);
  }

  // ============================================================
  // Scenes — each has render(side, activeDiffIds) + diffPool
  // Each diff describes a hit region (cx, cy, r). The scene render
  // function uses the activeDiffIds set to decide which A/B variant
  // of each element to draw.
  // ============================================================

  const VW = 400, VH = 400;

  // ---------- Scene 1: Underwater ----------
  const SCENE_UNDERWATER = {
    name: 'underwater', icon: '🌊',
    diffPool: [
      { id: 'bigfish',   cx: 210, cy: 200, r: 40 },
      { id: 'smallfish', cx: 88,  cy: 100, r: 30 },
      { id: 'starfish',  cx: 250, cy: 360, r: 26 },
      { id: 'bubble',    cx: 175, cy: 62,  r: 22 },
      { id: 'seaweed',   cx: 355, cy: 300, r: 34 },
      { id: 'coral',     cx: 122, cy: 340, r: 28 },

  const SCENES = [SCENE_UNDERWATER, SCENE_SPACE, SCENE_JUNGLE, SCENE_FARM, SCENE_CITY];
  const LEVELS_PER_SCENE = 20;
  const TOTAL_LEVELS = SCENES.length * LEVELS_PER_SCENE;   // 100

  function getSceneForLevel(level) {
    return SCENES[Math.min(SCENES.length - 1, Math.floor((level - 1) / LEVELS_PER_SCENE))];
  }
  function getDifficultyForLevel(level) {
    // Progressive: within each scene block of 20, difficulty rises
    const inScene = (level - 1) % LEVELS_PER_SCENE;   // 0..19
    // Difficulty tier: 0-easy, 1-med, 2-hard, 3-expert
    if (inScene < 5)  return 0;
    if (inScene < 10) return 1;
    if (inScene < 15) return 2;
    return 3;
  }
  function getLevelConfig(level) {
    const scene = getSceneForLevel(level);
    const rng = mulberry32(level * 7919);
    // Always pick exactly 5 diffs from the pool
    const chosen = pickN(scene.diffPool, 5, rng);
    const diffIds = new Set(chosen.map(d => d.id));
    // Fewer hints on higher levels, less hearts
    const diff = getDifficultyForLevel(level);
    const startHearts = diff >= 3 ? 3 : diff >= 2 ? 4 : 5;
    const startHints  = diff >= 3 ? 1 : diff >= 2 ? 2 : 3;
    return { scene, diffs: chosen, diffIds, startHearts, startHints };
  }

    try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); }

  }
  function saveProgress(p) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(p)); } catch {}
  }
  const progress = loadProgress();
  if (!progress.current) progress.current = 1;
  if (!progress.completed) progress.completed = [];
  if (!progress.maxUnlocked) progress.maxUnlocked = 1;

  // ============================================================

  function svgLocalPoint(svg, ev) {
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const ctm = svg.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    const local = pt.matrixTransform(ctm.inverse());
    return { x: local.x, y: local.y };
  }
  function bindSceneClicks(svg, side) {
    if (!svg) return;
    svg.addEventListener('click', (ev) => {
      if (!acceptInput) return;
      if (found.size >= config.diffs.length) return;
      const { x, y } = svgLocalPoint(svg, ev);
      let hit = null;
      for (const d of config.diffs) {
        if (found.has(d.id)) continue;
        const dx = x - d.cx, dy = y - d.cy;
        if (dx * dx + dy * dy <= d.r * d.r) { hit = d; break; }
      }
      if (hit) {
        found.add(hit.id);
        drawFoundMarker(hit.id);
        SFX.correct();
        updateHUD();
        if (found.size >= config.diffs.length) {
          acceptInput = false;
          setTimeout(showWin, 500);
        }
      } else {
        drawWrongMarker(svg, x, y);
        hearts = Math.max(0, hearts - 1);
        SFX.wrong();
        updateHUD();
        if (hearts <= 0) {
          acceptInput = false;
          setTimeout(showLose, 500);
        }
      }
    });
  }
  function drawFoundMarker(id) {
    const d = config.diffs.find(x => x.id === id);
    if (!d) return;
    for (const wrap of [sceneAWrap, sceneBWrap]) {
      const overlay = wrap.querySelector('g[data-overlay="marks"]');

      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', d.cx); c.setAttribute('cy', d.cy); c.setAttribute('r', d.r + 4);
      c.setAttribute('class', 'sd-found'); c.setAttribute('data-id', id);
      c.style.transformOrigin = `${d.cx}px ${d.cy}px`;
      c.style.transformBox = 'fill-box';
      overlay.appendChild(c);
    }
  }

    const d = config.diffs.find(x => x.id === id);

  $('sd-all-replay').addEventListener('click', () => {
    $('sd-modal-all-done').classList.remove('show');
    progress.completed = []; progress.current = 1; progress.maxUnlocked = 1;
    saveProgress(progress); goToLevel(1);
  });
  $('sd-level-btn').addEventListener('click', openLevelSelect);
  $('sd-level-close').addEventListener('click', () => $('sd-modal-level').classList.remove('show'));

  function showWin() {
    if (!progress.completed.includes(currentLevel)) progress.completed.push(currentLevel);
    progress.maxUnlocked = Math.max(progress.maxUnlocked, currentLevel + 1);
    progress.current = currentLevel;
    saveProgress(progress);
    $('sd-win-lvl').textContent = currentLevel;
    $('sd-win-hearts').textContent = hearts;
    $('sd-win-hints').textContent = hints;
    if (currentLevel >= TOTAL_LEVELS) {
      $('sd-next-label').textContent = '🎊 ' + T.allDone;
    } else {
      $('sd-next-label').textContent = T.nextLvl;
    }
    $('sd-modal-win').classList.add('show');
    SFX.win();
  }
  function showLose() {
    $('sd-lose-found').textContent = found.size;
    $('sd-modal-lose').classList.add('show');
    SFX.lose();
  }

  function resetLevel() {
    config = getLevelConfig(currentLevel);
    hearts = config.startHearts;
    hints  = config.startHints;
    found  = new Set();
    acceptInput = true;
    render();
  }
  function goToLevel(lv) {
    currentLevel = Math.min(TOTAL_LEVELS, Math.max(1, lv));
    progress.current = currentLevel;
    saveProgress(progress);
    resetLevel();
  }

  // ============================================================
  // Level selector
  // ============================================================
  function openLevelSelect() {
    const grid = $('sd-level-grid');
    grid.innerHTML = '';
    for (let i = 1; i <= TOTAL_LEVELS; i++) {
      const btn = document.createElement('button');
      const isCurrent = i === currentLevel;
      const isDone = progress.completed.includes(i);
      const isUnlocked = i <= progress.maxUnlocked;
      const scene = getSceneForLevel(i);
      btn.className = 'sd-lvl-cell' + (isCurrent ? ' current' :
                                       isDone ? ' completed' :
                                       isUnlocked ? ' unlocked' : ' locked');
      btn.textContent = i;
      btn.title = scene.icon + ' ' + scene.name;
      if (!isUnlocked) btn.disabled = true;
      btn.addEventListener('click', () => {
        $('sd-modal-level').classList.remove('show');
        goToLevel(i);
      });
      grid.appendChild(btn);
    }
    $('sd-modal-level').classList.add('show');
  }

  // ============================================================
  // Boot
  // ============================================================
  render();
})();
</script>
</body>
</html>

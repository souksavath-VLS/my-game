<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ลากเลข 1-10 · Trace Numbers</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { background: #f0f4f8; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif;
           -webkit-tap-highlight-color: transparent; }
    .dn-wrap { max-width: 480px; margin: 0 auto; padding: 8px; }

    .dn-header {
      background: linear-gradient(135deg, #2563eb, #1e3a8a);
      color: #fff; padding: 14px 16px; border-radius: 14px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 12px rgba(37,99,235,0.25); margin-bottom: 10px;
    }
    .dn-title { font-size: 1.15rem; font-weight: 800; letter-spacing: .5px; }
    .dn-header a { color: #fff; text-decoration: none; background: rgba(255,255,255,.18);
                   padding: 6px 12px; border-radius: 20px; font-size: .85rem; }

    .dn-prog-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .dn-prog-bar { flex: 1; background: #e2e8f0; border-radius: 99px; height: 10px; overflow: hidden; }
    .dn-prog-fill { background: linear-gradient(90deg, #2563eb, #7c3aed); height: 100%; width: 0%;
                    transition: width .35s; border-radius: 99px; }
    .dn-prog-text { font-weight: 700; color: #475569; font-size: .9rem; min-width: 70px; text-align: right; }

    .dn-info {
      background: #fff; border-radius: 14px; padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 10px;
      display: flex; align-items: center; gap: 12px;
    }
    .dn-num {
      font-size: 2.6rem; font-weight: 900; color: #2563eb;
      min-width: 70px; text-align: center;
      background: #eff6ff; border-radius: 12px; padding: 6px 12px;
      line-height: 1.1;
    }
    .dn-meta { flex: 1; min-width: 0; }
    .dn-name { font-size: 1rem; font-weight: 700; color: #1e293b;
               font-family: 'Noto Sans Lao', 'Segoe UI', sans-serif; }
    .dn-name-sub { font-size: .82rem; color: #64748b; margin-top: 2px; }
    .dn-rom {
      display: inline-block; margin-top: 4px;
      background: #fef3c7; color: #92400e;
      padding: 2px 10px; border-radius: 99px;
      font-weight: 700; font-size: .85rem;
    }

    .dn-canvas-wrap {
      position: relative; margin: 0 auto 10px;
      width: 100%; aspect-ratio: 1/1; max-width: 360px;
      background: #fff; border: 2px solid #cbd5e1; border-radius: 16px;
      overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.06);
    }
    .dn-canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #shadow-canvas { opacity: 0.22; pointer-events: none; }
    #user-canvas { background: transparent; cursor: crosshair; }

    .dn-feedback {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; pointer-events: none;
      opacity: 0; font-size: 3.5rem; text-align: center;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,.3));
    }
    .dn-feedback.show { animation: pop 1.1s ease-out; }
    .dn-feedback .pct { font-size: 1.2rem; color: #fff;
                        background: rgba(0,0,0,.55); padding: 4px 14px;
                        border-radius: 99px; margin-top: 6px; font-family: 'Segoe UI'; font-weight: 700; }
    @keyframes pop {
      0% { opacity: 0; transform: scale(.4); }
      30% { opacity: 1; transform: scale(1.15); }
      80% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1); }
    }

    .dn-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .dn-btn {
      padding: 12px 6px; border-radius: 12px; border: 2px solid #cbd5e1;
      background: #fff; color: #1e293b; font-weight: 700; font-size: .85rem;
      cursor: pointer; box-shadow: 0 2px 4px rgba(0,0,0,.05);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      min-height: 56px;
    }
    .dn-btn:active { transform: translateY(2px); box-shadow: none; }
    .dn-btn .icon { font-size: 1.1rem; line-height: 1; }
    .dn-btn .lbl { font-size: .72rem; line-height: 1; }
    .dn-btn.primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff; border-color: #059669;
      box-shadow: 0 2px 8px rgba(16,185,129,.35);
    }

    .dn-stats {
      display: flex; justify-content: space-around;
      background: #fff; border-radius: 12px; padding: 8px 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,.05); font-size: .85rem;
    }
    .dn-stat { text-align: center; }
    .dn-stat .lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    .dn-stat .val { font-weight: 800; font-size: 1.05rem; color: #1e293b; }
    .dn-stat .val.best { color: #f59e0b; }
    .dn-stat .val.done { color: #10b981; }

    @media (max-width: 360px) {
      .dn-num { font-size: 2.2rem; min-width: 60px; }
      .dn-btn { font-size: .8rem; padding: 10px 4px; }
    }
  </style>
</head>
<body>
  <div class="dn-wrap">
    <div class="dn-header">
      <div class="dn-title" id="hdr-title">🔢 ลากเลข 1-10</div>
      <a href="index.html" id="hdr-back">← หน้าหลัก</a>
    </div>

    <div class="dn-prog-row">
      <div class="dn-prog-bar"><div class="dn-prog-fill" id="prog-fill"></div></div>
      <div class="dn-prog-text"><span id="prog-cur">1</span>/<span id="prog-total">10</span></div>
    </div>

    <div class="dn-info">
      <div class="dn-num" id="numeral"></div>
      <div class="dn-meta">
        <div class="dn-name" id="vname"></div>
        <div class="dn-name-sub" id="vname-sub"></div>
        <span class="dn-rom" id="vrom"></span>
      </div>
    </div>

    <div class="dn-canvas-wrap" id="canvas-wrap">
      <canvas id="shadow-canvas"></canvas>
      <canvas id="user-canvas"></canvas>
      <div class="dn-feedback" id="feedback"></div>
    </div>

    <div class="dn-actions">
      <button class="dn-btn" id="btn-prev"><span class="icon">←</span><span class="lbl" id="lbl-prev">ก่อนหน้า</span></button>
      <button class="dn-btn" id="btn-speak"><span class="icon">🔊</span><span class="lbl" id="lbl-speak">ออกเสียง</span></button>
      <button class="dn-btn" id="btn-clear"><span class="icon">🧹</span><span class="lbl" id="lbl-clear">ลบเส้น</span></button>
      <button class="dn-btn primary" id="btn-check"><span class="icon">✓</span><span class="lbl" id="lbl-check">ตรวจ</span></button>
    </div>

    <div class="dn-stats">
      <div class="dn-stat">
        <div class="lbl" id="lbl-best">ดีที่สุด</div>
        <div class="val best"><span id="ui-best">0</span>%</div>
      </div>
      <div class="dn-stat">
        <div class="lbl" id="lbl-done">ผ่านแล้ว</div>
        <div class="val done"><span id="ui-done">0</span>/<span id="ui-done-total">10</span></div>
      </div>
      <div class="dn-stat">
        <div class="lbl" id="lbl-tries">รอบนี้</div>
        <div class="val"><span id="ui-tries">0</span> ครั้ง</div>
      </div>
    </div>
  </div>

  <script src="js/tts.js"></script>
  <script src="js/draw-number-game.js"></script>
</body>
</html>

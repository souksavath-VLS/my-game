<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>จับคู่ภาพ · Memory Match</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: linear-gradient(180deg, #fef3c7, #fed7aa);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }
    .km-wrap { max-width: 480px; margin: 0 auto; padding: 8px; }

    .km-header {
      background: linear-gradient(135deg, #ec4899, #be185d);
      color: #fff; padding: 14px 16px; border-radius: 14px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 12px rgba(236,72,153,0.3); margin-bottom: 10px;
    }
    .km-title { font-size: 1.15rem; font-weight: 800; letter-spacing: .5px; }
    .km-header a { color: #fff; text-decoration: none; background: rgba(255,255,255,.22);
                   padding: 6px 12px; border-radius: 20px; font-size: .85rem; }

    /* Theme pill */
    .km-theme {
      background: #fff; border-radius: 10px; padding: 8px 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .km-theme .em { font-size: 1.5rem; }
    .km-theme .label {
      font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
    }
    .km-theme .name {
      font-weight: 800; font-size: 1rem; color: #1e293b;
      font-family: 'Noto Sans Lao', 'Segoe UI', sans-serif;
    }

    /* HUD */
    .km-hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .km-stat { background: #fff; border-radius: 10px; padding: 8px 4px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .km-stat .lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .km-stat .val { font-size: 18px; font-weight: 900; color: #1e293b; line-height: 1.1; }
    .km-stat .val.level { color: #ec4899; }
    .km-stat .val.moves { color: #2563eb; }
    .km-stat .val.time { color: #16a34a; }
    .km-stat .val.best { color: #b45309; }

    /* Board */
    .km-board {
      display: grid; gap: 8px; margin-bottom: 10px;
      justify-content: center;
    }
    .km-card {
      aspect-ratio: 1 / 1;
      perspective: 600px;
      cursor: pointer;
      min-width: 60px;
    }
    .km-card-inner {
      position: relative; width: 100%; height: 100%;
      transition: transform .5s;
      transform-style: preserve-3d;
    }
    .km-card.flipped .km-card-inner,
    .km-card.matched .km-card-inner {
      transform: rotateY(180deg);
    }
    .km-card-front, .km-card-back {
      position: absolute; inset: 0;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      backface-visibility: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,.12);
    }
    .km-card-front {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #fff; font-size: 2rem; font-weight: 900;
      border: 3px solid #d97706;
      text-shadow: 0 1px 2px rgba(0,0,0,.18);
    }
    .km-card-back {
      background: #fff;
      transform: rotateY(180deg);
      font-size: 2.2rem;
      border: 3px solid #cbd5e1;
    }
    .km-card.matched .km-card-back {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      border-color: #10b981;
      box-shadow: 0 2px 12px rgba(16,185,129,.35);
    }
    .km-card.wrong .km-card-back {
      background: #fee2e2;
      border-color: #ef4444;
      animation: shake .4s;
    }
    @keyframes shake {
      0%,100% { transform: rotateY(180deg) translateX(0); }
      25% { transform: rotateY(180deg) translateX(-6px); }
      75% { transform: rotateY(180deg) translateX(6px); }
    }

    .km-actions { display: flex; gap: 8px; }
    .km-btn {
      flex: 1; padding: 12px; border-radius: 12px; border: none;
      font-weight: 800; font-size: 1rem; cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,.12);
    }
    .km-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
    .km-btn.primary { background: linear-gradient(135deg, #ec4899, #be185d); color: #fff; }
    .km-btn.secondary { background: #fff; color: #1e293b; border: 2px solid #cbd5e1; box-shadow: 0 2px 0 rgba(0,0,0,.1); }

    /* Modal */
    .km-modal {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(15,23,42,0.7); backdrop-filter: blur(4px); z-index: 20;
    }
    .km-modal.show { display: flex; }
    .km-modal-card {
      background: #fff; border-radius: 18px; padding: 24px 28px;
      max-width: 92%; min-width: 280px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .km-modal-card h2 { margin: 0 0 8px; color: #be185d; font-size: 1.5rem; }
    .km-stars { font-size: 2.6rem; margin: 10px 0; letter-spacing: 4px; }
    .km-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .km-stats-grid .cell { background: #fce7f3; padding: 10px; border-radius: 10px; }
    .km-stats-grid .lbl { font-size: 10px; color: #be185d; text-transform: uppercase; font-weight: 700; }
    .km-stats-grid .val { font-size: 1.4rem; font-weight: 900; color: #1e293b; }
    .new-best {
      display: inline-block; background: #fde68a; color: #92400e;
      font-weight: 900; font-size: .8rem; padding: 3px 12px;
      border-radius: 99px; margin-bottom: 8px; box-shadow: 0 0 12px rgba(251,191,36,.5);
    }

    @media (max-width: 380px) {
      .km-card-front { font-size: 1.6rem; }
      .km-card-back { font-size: 1.8rem; }
      .km-stat .val { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="km-wrap">
    <div class="km-header">
      <div class="km-title" id="hdr-title">🃏 จับคู่ภาพ</div>
      <a href="index.html" id="hdr-back">← หน้าหลัก</a>
    </div>

    <div class="km-theme">
      <span class="em" id="theme-em">🍎</span>
      <div>
        <div class="label" id="theme-lbl">หมวด</div>
        <div class="name" id="theme-name">ผลไม้</div>
      </div>
    </div>

    <div class="km-hud">
      <div class="km-stat"><div class="lbl" id="lbl-level">เลเวล</div><div class="val level" id="ui-level">1</div></div>
      <div class="km-stat"><div class="lbl" id="lbl-moves">ครั้ง</div><div class="val moves" id="ui-moves">0</div></div>
      <div class="km-stat"><div class="lbl" id="lbl-time">เวลา</div><div class="val time" id="ui-time">0s</div></div>
      <div class="km-stat"><div class="lbl" id="lbl-best">ดีที่สุด</div><div class="val best" id="ui-best">—</div></div>
    </div>

    <div class="km-board" id="board"></div>

    <div class="km-actions">
      <button class="km-btn secondary" id="btn-restart">🔄 <span id="lbl-restart">เริ่มใหม่</span></button>
      <button class="km-btn primary" id="btn-shuffle">🎲 <span id="lbl-shuffle">สับใหม่</span></button>
    </div>
  </div>

  <div class="km-modal" id="modal-win">
    <div class="km-modal-card">
      <div class="new-best" id="newbest" style="display:none">⭐ NEW BEST!</div>
      <h2 id="win-title">เก่งมาก!</h2>
      <div class="km-stars" id="win-stars">⭐⭐⭐</div>
      <div class="km-stats-grid">
        <div class="cell">
          <div class="lbl" id="win-lbl-time">เวลา</div>
          <div class="val" id="win-time">0s</div>
        </div>
        <div class="cell">
          <div class="lbl" id="win-lbl-moves">ครั้ง</div>
          <div class="val" id="win-moves">0</div>
        </div>
      </div>
      <button class="km-btn primary" style="width:100%" id="btn-next">▶ <span id="lbl-next">เลเวลถัดไป</span></button>
    </div>
  </div>

  <script src="js/kids-game.js"></script>
</body>
</html>

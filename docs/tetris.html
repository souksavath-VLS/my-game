<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tetris Pro</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* ---------- Themes ---------- */
    body.theme-wood {
      background: linear-gradient(135deg, #e0c28c 0%, #8d6e3c 100%);
    }
    body.theme-galaxy {
      background: radial-gradient(ellipse at top, #1b0a3a 0%, #0d133d 100%);
    }
    body.theme-wood #tetris-board   { border-color: #8d6e3c; box-shadow: 0 0 20px rgba(141, 110, 60, 0.5); }
    body.theme-galaxy #tetris-board { border-color: #7c4dff; box-shadow: 0 0 25px rgba(124, 77, 255, 0.7); }
    body.theme-wood .tetris-pill    { border-color: rgba(141, 110, 60, 0.6); background: rgba(141, 110, 60, 0.18); color: #fff; }
    body.theme-galaxy .tetris-pill  { border-color: rgba(124, 77, 255, 0.6); background: rgba(124, 77, 255, 0.18); color: #fff; }

    /* ---------- Layout ---------- */
    .tetris-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 6px 0;
      height: 100vh;
      box-sizing: border-box;
    }
    .tetris-title {
      color: #64b5f6;
      margin: 0 0 4px;
      font-size: 1.4em;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #1976d288;
    }
    .tetris-statusbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      margin-bottom: 6px;
      flex-wrap: wrap;
      padding: 0 6px;
      max-width: 100vw;
    }
    .tetris-pill {
      background: rgba(100, 181, 246, 0.14);
      border: 1px solid rgba(100, 181, 246, 0.45);
      padding: 3px 10px;
      border-radius: 12px;
      color: #e3f2fd;
      white-space: nowrap;
    }
    .tetris-pill strong {
      color: #fff;
      font-size: 1rem;
    }

    /* Main play area */
    .tetris-play-area {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 10px;
      flex: 1 1 auto;
      min-height: 0;
      padding: 0 4px;
    }

    /* Board */
    #tetris-board {
      display: grid;
      grid-template-columns: repeat(var(--cols, 10), 1fr);
      grid-template-rows: repeat(var(--rows, 20), 1fr);
      aspect-ratio: 1 / 2;
      height: min(74vh, 90vw * 2);
      max-width: 50vw;
      width: auto;
      gap: 1px;
      background: linear-gradient(160deg, #0a1929 0%, #1a2a4a 100%);
      border: 3px solid #1976d2;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(25, 118, 210, 0.5);
      box-sizing: border-box;
      position: relative;
      touch-action: none;
    }
    .tetris-cell {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 2px;
      min-width: 0;
      min-height: 0;
    }
    .tetris-cell.fixed {
      border-radius: 3px;
      box-shadow: inset 0 0 4px rgba(255, 255, 255, 0.3);
    }
    .tetris-cell.active {
      border-radius: 3px;
      box-shadow: 0 0 4px currentColor, inset 0 0 4px rgba(255, 255, 255, 0.4);
    }
    .tetris-cell.ghost {
      border-radius: 3px;
      opacity: 0.25;
    }

    /* Side panel */
    .tetris-side {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 72px;
    }
    .tetris-side-label {
      color: #90caf9;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-align: center;
      margin: 0 0 2px;
    }
    #next-preview {
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid #1976d2;
      border-radius: 8px;
      padding: 6px;
      min-width: 60px;
      min-height: 60px;
      display: grid;
      gap: 2px;
      box-sizing: border-box;
      aspect-ratio: 1 / 1;
    }
    .next-cell {
      min-width: 0;
      min-height: 0;
      border-radius: 2px;
    }
    .next-cell.on {
      box-shadow: 0 0 3px currentColor;
    }

    /* Drop button under the NEXT preview */
    .tetris-drop-btn {
      margin-top: 4px;
      padding: 10px 6px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #f44336, #ff9800);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      box-shadow: 0 4px 0 rgba(150, 30, 0, 0.5);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      width: 100%;
    }
    .tetris-drop-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(150, 30, 0, 0.5);
    }
    body.theme-wood .tetris-drop-btn {
      background: linear-gradient(135deg, #bc8f4a, #8d6e3c);
      box-shadow: 0 4px 0 rgba(80, 50, 20, 0.5);
    }
    body.theme-galaxy .tetris-drop-btn {
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      box-shadow: 0 4px 0 rgba(50, 20, 120, 0.5);
    }

    /* Toast popup (e.g., TETRIS!) */
    .tetris-toast {
      position: fixed;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.4em;
      font-weight: bold;
      color: #fff700;
      text-shadow: 0 0 12px #fff700, 0 0 4px #000;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 25;
      letter-spacing: 2px;
    }
    .tetris-toast.tetris-toast-big {
      font-size: 2em;
      color: #ff4081;
      text-shadow: 0 0 18px #ff4081, 0 0 6px #fff;
      animation: tetrisToastPulse 0.5s infinite alternate;
    }
    @keyframes tetrisToastPulse {
      from { transform: translate(-50%, -50%) scale(1); }
      to   { transform: translate(-50%, -50%) scale(1.15); }
    }

    /* Buttons */
    .tetris-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 8px 0 6px;
      flex-wrap: wrap;
    }
    .tetris-btn {
      padding: 9px 20px;
      font-size: 0.95em;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(15, 70, 130, 0.55);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tetris-btn.primary {
      background: linear-gradient(135deg, #1976d2, #64b5f6);
      color: #fff;
    }
    .tetris-btn.secondary {
      background: #333;
      color: #fff;
      box-shadow: 0 4px 0 rgba(20, 20, 20, 0.6);
    }
    .tetris-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(15, 70, 130, 0.55); }

    #tetris-hint {
      margin: 0 0 4px;
      opacity: 0.65;
      font-size: 0.78rem;
      padding: 0 8px;
    }

    /* Floating buttons */
    #tetris-exit-btn {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 30;
      padding: 6px 12px;
      background: #ff4444;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85em;
    }
    #tetris-mute-btn, #tetris-pause-btn {
      position: fixed;
      top: 8px;
      z-index: 30;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      border: 2px solid rgba(100, 181, 246, 0.5);
      font-size: 1.1em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #tetris-mute-btn  { right: 8px; }
    #tetris-pause-btn { right: 52px; }

    /* Overlays */
    .tetris-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .tetris-card {
      background: linear-gradient(145deg, #0a1929, #16213e);
      border: 2px solid #1976d2;
      border-radius: 16px;
      padding: 26px 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 30px rgba(25, 118, 210, 0.55);
      animation: tetrisCardPop 0.35s ease-out;
    }
    @keyframes tetrisCardPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .tetris-card h2 {
      margin: 0 0 12px;
      font-size: 1.5em;
      color: #64b5f6;
      text-shadow: 0 0 8px #64b5f6;
    }
    .tetris-score-big {
      font-size: 2.5em;
      font-weight: bold;
      color: #fff700;
      text-shadow: 0 0 12px #fff700;
      margin: 8px 0;
    }
    #tetris-new-record {
      display: inline-block;
      background: #ff5252;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      animation: tetrisPulse 0.6s infinite alternate;
    }
    @keyframes tetrisPulse {
      from { transform: scale(1); }
      to   { transform: scale(1.08); }
    }
    .tetris-final-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 6px 0;
      font-size: 0.95em;
      color: #c0d0e0;
    }
    .tetris-hi-line { color: #ffd700; font-size: 1em; margin: 6px 0; }

    @media (max-width: 600px) {
      .tetris-title { font-size: 1.15em; }
      .tetris-statusbar { font-size: 0.75rem; gap: 4px; }
      .tetris-pill { padding: 2px 8px; }
      .tetris-pill strong { font-size: 0.9rem; }
      .tetris-side { min-width: 56px; }
      .tetris-side-label { font-size: 0.65rem; }
      #next-preview { min-width: 50px; min-height: 50px; padding: 4px; }
      .tetris-drop-btn { font-size: 0.75rem; padding: 8px 4px; }
      .tetris-btn { font-size: 0.85em; padding: 7px 14px; }
      #tetris-hint { font-size: 0.7rem; }
      #tetris-board { height: min(70vh, 90vw * 2); }
    }
  </style>
</head>
<body>
  <a id="tetris-exit-btn" href="index.html">Exit</a>
  <button id="tetris-pause-btn" aria-label="Pause">⏸</button>
  <button id="tetris-mute-btn"  aria-label="Mute">🔊</button>

  <div class="tetris-container">
    <h2 class="tetris-title" id="tetris-title">Tetris Pro</h2>

    <div class="tetris-statusbar">
      <span class="tetris-pill"><span id="label-score">Score:</span> <strong id="tetris-score">0</strong></span>
      <span class="tetris-pill"><span id="label-lines">Lines:</span> <strong id="tetris-lines">0</strong></span>
      <span class="tetris-pill"><span id="label-level">Lvl:</span> <strong id="tetris-level">1</strong></span>
      <span class="tetris-pill">🏆 <strong id="tetris-highscore">0</strong></span>
      <span class="tetris-pill">⏱ <strong id="tetris-time">00:00</strong></span>
    </div>

    <div class="tetris-play-area">
      <div id="tetris-board"></div>
      <div class="tetris-side">
        <p class="tetris-side-label" id="label-next">NEXT</p>
        <div id="next-preview"></div>
        <button id="tetris-drop-btn" class="tetris-drop-btn" aria-label="Drop">⏬ <span id="label-drop">Drop</span></button>
      </div>
    </div>

    <p id="tetris-hint">Tap = rotate · Swipe = move · Swipe up = drop</p>

    <div class="tetris-actions">
      <button id="start-btn" class="tetris-btn primary">Start Game</button>
      <button id="theme-btn" class="tetris-btn secondary">Theme</button>
    </div>
  </div>

  <!-- Toast (line clear popup) -->
  <div id="tetris-toast" class="tetris-toast"></div>

  <!-- Pause overlay -->
  <div id="tetris-pause-overlay" class="tetris-overlay" style="display:none;">
    <div class="tetris-card">
      <h2 id="tetris-pause-title">Paused</h2>
      <button id="tetris-resume-btn" class="tetris-btn primary">Resume</button>
    </div>
  </div>

  <!-- Game over modal -->
  <div id="tetris-gameover-modal" class="tetris-overlay" style="display:none;">
    <div class="tetris-card">
      <h2 id="tetris-gameover-title">Game Over</h2>
      <div id="tetris-new-record" style="display:none;">NEW RECORD!</div>
      <p id="tetris-final-label">Your Score</p>
      <div class="tetris-score-big"><span id="tetris-final-score">0</span></div>
      <div class="tetris-final-row">
        <span><span id="tetris-final-lines-label">Lines:</span> <strong id="tetris-final-lines">0</strong></span>
        <span><span id="tetris-final-level-label">Level:</span> <strong id="tetris-final-level">1</strong></span>
      </div>
      <p class="tetris-hi-line">🏆 <span id="tetris-final-hi-label">Best:</span> <span id="tetris-final-hi">0</span></p>
      <button id="tetris-replay-btn" class="tetris-btn primary">Play Again</button>
    </div>
  </div>

  <script src="js/tetris.js"></script>
  <script>
    const tetrisLangData = {
      th: {
        title: 'Tetris Pro',
        score: 'คะแนน:', lines: 'แถว:', level: 'ระดับ:',
        next: 'ถัดไป', drop: 'ปล่อย',
        start: 'เริ่มเกม', theme: 'เปลี่ยนธีม', exit: 'ออกเกม',
        hint: 'แตะ = หมุน · ปัด = ย้าย · ปัดขึ้น = ปล่อย',
        paused: 'หยุดชั่วคราว', resume: 'เล่นต่อ',
        gameOver: 'จบเกม!', newRecord: 'สถิติใหม่!',
        finalLabel: 'คะแนนของคุณ', finalLines: 'แถว:', finalLevel: 'ระดับ:',
        finalHi: 'สูงสุด:', playAgain: 'เล่นอีก',
        single: 'เคลียร์!', double: 'สอง!', triple: 'สาม!', tetris: 'เทตริส!'
      },
      en: {
        title: 'Tetris Pro',
        score: 'Score:', lines: 'Lines:', level: 'Lvl:',
        next: 'NEXT', drop: 'Drop',
        start: 'Start Game', theme: 'Theme', exit: 'Exit',
        hint: 'Tap = rotate · Swipe = move · Swipe up = drop',
        paused: 'Paused', resume: 'Resume',
        gameOver: 'Game Over', newRecord: 'NEW RECORD!',
        finalLabel: 'Your Score', finalLines: 'Lines:', finalLevel: 'Level:',
        finalHi: 'Best:', playAgain: 'Play Again',
        single: 'Single!', double: 'Double!', triple: 'Triple!', tetris: 'TETRIS!'
      },
      lao: {
        title: 'Tetris Pro',
        score: 'ຄະແນນ:', lines: 'ແຖວ:', level: 'ລະດັບ:',
        next: 'ຖັດໄປ', drop: 'ປ່ອຍ',
        start: 'ເລີ່ມເກມ', theme: 'ປ່ຽນທີມ', exit: 'ອອກເກມ',
        hint: 'ແຕະ = ໝຸນ · ປັດ = ຍ້າຍ · ປັດຂຶ້ນ = ປ່ອຍ',
        paused: 'ຢຸດຊົ່ວຄາວ', resume: 'ຫຼິ້ນຕໍ່',
        gameOver: 'ຈົບເກມ!', newRecord: 'ສະຖິຕິໃໝ່!',
        finalLabel: 'ຄະແນນຂອງເຈົ້າ', finalLines: 'ແຖວ:', finalLevel: 'ລະດັບ:',
        finalHi: 'ສູງສຸດ:', playAgain: 'ຫຼິ້ນອີກ',
        single: 'ດີ!', double: 'ສອງ!', triple: 'ສາມ!', tetris: 'ເທຕຣິສ!'
      }
    };
    function setTetrisLang() {
      let lang = localStorage.getItem('lang') || 'en';
      if (!['th', 'en', 'lao'].includes(lang)) lang = 'en';
      const t = tetrisLangData[lang];
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
      set('tetris-title', t.title);
      set('label-score', t.score);
      set('label-lines', t.lines);
      set('label-level', t.level);
      set('label-next', t.next);
      set('label-drop', t.drop);
      set('start-btn', t.start);
      set('theme-btn', t.theme);
      set('tetris-exit-btn', t.exit);
      set('tetris-hint', t.hint);
      set('tetris-pause-title', t.paused);
      set('tetris-resume-btn', t.resume);
      set('tetris-gameover-title', t.gameOver);
      set('tetris-new-record', t.newRecord);
      set('tetris-final-label', t.finalLabel);
      set('tetris-final-lines-label', t.finalLines);
      set('tetris-final-level-label', t.finalLevel);
      set('tetris-final-hi-label', t.finalHi);
      set('tetris-replay-btn', t.playAgain);
      window.tetrisLang = t;
    }
    document.addEventListener('DOMContentLoaded', setTetrisLang);
  </script>
</body>
</html>

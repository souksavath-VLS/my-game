<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pac-Man Pro</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .pacman-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12px;
      height: 100vh;
      box-sizing: border-box;
    }
    .pacman-title {
      color: #ffd600;
      margin: 0 0 6px;
      font-size: 1.6em;
      letter-spacing: 1px;
      text-shadow: 0 0 6px #ffd60088;
    }
    .pacman-statusbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 1rem;
      margin-bottom: 8px;
      flex-wrap: wrap;
      padding: 0 10px;
    }
    .pacman-statusbar .pill {
      background: rgba(255, 214, 0, 0.12);
      border: 1px solid rgba(255, 214, 0, 0.5);
      padding: 4px 12px;
      border-radius: 14px;
      color: #ffe57f;
    }
    #pacman-lives {
      font-size: 1rem;
      letter-spacing: 1px;
    }

    /* Board — JS sets --cols / --rows */
    #pacman-board {
      display: grid;
      grid-template-columns: repeat(var(--cols, 15), 1fr);
      grid-template-rows: repeat(var(--rows, 15), 1fr);
      aspect-ratio: var(--cols, 15) / var(--rows, 15);
      gap: 1px;
      background: #000;
      border: 3px solid #ffd600;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 214, 0, 0.55);
      width: min(450px, 92vw, 60vh);
      max-width: 100vw;
      box-sizing: border-box;
      margin: 0 auto;
      touch-action: none;
    }

    .pacman-cell {
      background: #000;
      min-width: 0;
      min-height: 0;
      position: relative;
    }
    .pacman-cell.wall {
      background: #1976d2;
      border-radius: 2px;
      box-shadow: inset 0 0 4px rgba(0, 100, 255, 0.6);
    }
    .pacman-cell.dot::after {
      content: '';
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 25%; height: 25%;
      background: #fff;
      border-radius: 50%;
    }
    .pacman-cell.power::after {
      content: '';
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 55%; height: 55%;
      background: #ffd600;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffd600;
      animation: powerPulse 0.5s infinite alternate;
    }
    @keyframes powerPulse {
      from { transform: translate(-50%, -50%) scale(1); }
      to   { transform: translate(-50%, -50%) scale(1.25); }
    }

    /* Pac-Man with a mouth, rotated by direction */
    .pacman-cell.pacman {
      background: transparent;
    }
    .pacman-cell.pacman::after {
      content: '';
      position: absolute;
      inset: 8%;
      background: #ffd600;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffd60099;
      clip-path: polygon(50% 50%, 100% 25%, 100% 0, 0 0, 0 100%, 100% 100%, 100% 75%);
    }
    .pacman-cell.pacman.dir-right::after { transform: rotate(0deg); }
    .pacman-cell.pacman.dir-down::after  { transform: rotate(90deg); }
    .pacman-cell.pacman.dir-left::after  { transform: rotate(180deg); }
    .pacman-cell.pacman.dir-up::after    { transform: rotate(270deg); }

    /* Ghosts: half-circle top, blocky bottom */
    .pacman-cell.ghost {
      background: transparent;
    }
    .pacman-cell.ghost::after {
      content: '';
      position: absolute;
      inset: 8%;
      border-radius: 50% 50% 15% 15% / 60% 60% 15% 15%;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }
    .pacman-cell.ghost-red::after    { background: #f44336; }
    .pacman-cell.ghost-blue::after   { background: #1976d2; }
    .pacman-cell.ghost-orange::after { background: #ff9800; }
    .pacman-cell.ghost-green::after  { background: #4caf50; }
    .pacman-cell.ghost-scared::after {
      background: #2196f3;
      box-shadow: 0 0 6px #2196f3;
    }
    .pacman-cell.ghost-scared.flashing::after {
      animation: scaredFlash 0.25s infinite alternate;
    }
    @keyframes scaredFlash {
      from { background: #2196f3; }
      to   { background: #fff; }
    }
    .pacman-cell.ghost-eaten::after {
      background: transparent;
      border: 2px solid #888;
      box-shadow: none;
    }

    /* Buttons */
    .pacman-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 12px 0 0;
      flex-wrap: wrap;
    }
    .pacman-btn {
      padding: 10px 22px;
      font-size: 1em;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(160, 130, 0, 0.5);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pacman-btn.primary {
      background: linear-gradient(135deg, #ffd600, #fffde7);
      color: #222;
    }
    .pacman-btn.secondary {
      background: #333;
      color: #fff;
      box-shadow: 0 4px 0 rgba(20, 20, 20, 0.6);
    }
    .pacman-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(160, 130, 0, 0.5); }

    #pacman-hint {
      margin: 8px 0 0;
      opacity: 0.7;
      font-size: 0.9rem;
    }

    /* Floating buttons */
    #pacman-exit-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 30;
      padding: 8px 14px;
      background: #ff4444;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95em;
    }
    #pacman-mute-btn, #pacman-pause-btn {
      position: fixed;
      top: 10px;
      z-index: 30;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      border: 2px solid rgba(255, 214, 0, 0.55);
      font-size: 1.2em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #pacman-mute-btn  { right: 10px; }
    #pacman-pause-btn { right: 60px; }

    /* Overlays */
    .pacman-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .pacman-card {
      background: linear-gradient(145deg, #2a2200, #0d0d00);
      border: 2px solid #ffd600;
      border-radius: 16px;
      padding: 28px 36px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 30px rgba(255, 214, 0, 0.55);
      animation: pacmanCardPop 0.35s ease-out;
    }
    @keyframes pacmanCardPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pacman-card h2 {
      margin: 0 0 12px;
      font-size: 1.5em;
      color: #ffd600;
      text-shadow: 0 0 8px #ffd600;
    }
    .pacman-score-big {
      font-size: 2.6em;
      font-weight: bold;
      color: #ffd600;
      text-shadow: 0 0 12px #ffd600;
      margin: 10px 0;
    }
    #pacman-new-record {
      display: inline-block;
      background: #ff5252;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      animation: pacmanPulse 0.6s infinite alternate;
    }
    @keyframes pacmanPulse {
      from { transform: scale(1); }
      to   { transform: scale(1.08); }
    }
    .pacman-hi-line { color: #ffd700; font-size: 1.05em; margin: 8px 0; }

    @media (max-width: 600px) {
      .pacman-title { font-size: 1.3em; }
      .pacman-statusbar { font-size: 0.9rem; gap: 8px; }
      .pacman-btn { font-size: 0.9rem; padding: 8px 16px; }
      .pacman-card { padding: 20px 24px; }
      .pacman-card h2 { font-size: 1.25em; }
      .pacman-score-big { font-size: 2.1em; }
    }
  </style>
</head>
<body>
  <a id="pacman-exit-btn" href="index.html">Exit</a>
  <button id="pacman-pause-btn" aria-label="Pause">⏸</button>
  <button id="pacman-mute-btn"  aria-label="Mute">🔊</button>

  <div class="pacman-container">
    <h2 class="pacman-title" id="pacman-title">Pac-Man Pro</h2>

    <div class="pacman-statusbar">
      <span class="pill"><span id="label-score">Score:</span> <span id="pacman-score">0</span></span>
      <span class="pill">🏆 <span id="label-hi">Best:</span> <span id="pacman-highscore">0</span></span>
      <span class="pill"><span id="label-lives">Lives:</span> <span id="pacman-lives">❤️❤️❤️</span></span>
    </div>

    <div id="pacman-board"></div>

    <p id="pacman-hint">Swipe on the board to control</p>

    <div class="pacman-actions">
      <button id="start-pacman-btn" class="pacman-btn primary">Start Game</button>
    </div>
  </div>

  <!-- Pause overlay -->
  <div id="pacman-pause-overlay" class="pacman-overlay" style="display:none;">
    <div class="pacman-card">
      <h2 id="pacman-pause-title">Paused</h2>
      <button id="pacman-resume-btn" class="pacman-btn primary">Resume</button>
    </div>
  </div>

  <!-- End-of-game / level-clear modal -->
  <div id="pacman-end-modal" class="pacman-overlay" style="display:none;">
    <div class="pacman-card">
      <h2 id="pacman-end-title">Game Over</h2>
      <div id="pacman-new-record" style="display:none;">NEW RECORD!</div>
      <p id="pacman-final-label">Your Score</p>
      <div class="pacman-score-big"><span id="pacman-final-score">0</span></div>
      <p class="pacman-hi-line">🏆 <span id="pacman-final-hi-label">Best:</span> <span id="pacman-final-hi">0</span></p>
      <button id="pacman-replay-btn" class="pacman-btn primary">Play Again</button>
      <button id="pacman-next-btn" class="pacman-btn primary" style="display:none;">Next Level</button>
    </div>
  </div>

  <script src="js/pacman.js"></script>
  <script>
    const pacmanLangData = {
      th: {
        title: 'Pac-Man Pro', score: 'คะแนน:', hi: 'สูงสุด:', lives: 'ชีวิต:',
        start: 'เริ่มเกม', exit: 'ออกเกม',
        hint: 'ปัดบนกระดานเพื่อบังคับ',
        paused: 'หยุดชั่วคราว', resume: 'เล่นต่อ',
        gameOver: 'จบเกม!', win: 'ผ่านด่าน!', newRecord: 'สถิติใหม่!',
        finalLabel: 'คะแนนของคุณ', finalHi: 'สูงสุด:', playAgain: 'เล่นอีก', nextLevel: 'ด่านต่อไป'
      },
      en: {
        title: 'Pac-Man Pro', score: 'Score:', hi: 'Best:', lives: 'Lives:',
        start: 'Start Game', exit: 'Exit',
        hint: 'Swipe on the board to control',
        paused: 'Paused', resume: 'Resume',
        gameOver: 'Game Over', win: 'Level Cleared!', newRecord: 'NEW RECORD!',
        finalLabel: 'Your Score', finalHi: 'Best:', playAgain: 'Play Again', nextLevel: 'Next Level'
      },
      lao: {
        title: 'Pac-Man Pro', score: 'ຄະແນນ:', hi: 'ສູງສຸດ:', lives: 'ຊີວິດ:',
        start: 'ເລີ່ມເກມ', exit: 'ອອກເກມ',
        hint: 'ປັດເທິງກະດານເພື່ອບັງຄັບ',
        paused: 'ຢຸດຊົ່ວຄາວ', resume: 'ຫຼິ້ນຕໍ່',
        gameOver: 'ຈົບເກມ!', win: 'ຜ່ານດ່ານ!', newRecord: 'ສະຖິຕິໃໝ່!',
        finalLabel: 'ຄະແນນຂອງເຈົ້າ', finalHi: 'ສູງສຸດ:', playAgain: 'ຫຼິ້ນອີກ', nextLevel: 'ດ່ານຕໍ່ໄປ'
      }
    };
    function setPacmanLang() {
      let lang = localStorage.getItem('lang') || 'en';
      if (!['th', 'en', 'lao'].includes(lang)) lang = 'en';
      const t = pacmanLangData[lang];
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
      set('pacman-title', t.title);
      set('label-score', t.score);
      set('label-hi', t.hi);
      set('label-lives', t.lives);
      set('start-pacman-btn', t.start);
      set('pacman-exit-btn', t.exit);
      set('pacman-hint', t.hint);
      set('pacman-pause-title', t.paused);
      set('pacman-resume-btn', t.resume);
      set('pacman-end-title', t.gameOver);
      set('pacman-new-record', t.newRecord);
      set('pacman-final-label', t.finalLabel);
      set('pacman-final-hi-label', t.finalHi);
      set('pacman-replay-btn', t.playAgain);
      set('pacman-next-btn', t.nextLevel);
      window.pacmanLang = t;
    }
    document.addEventListener('DOMContentLoaded', setPacmanLang);
  </script>
</body>
</html>

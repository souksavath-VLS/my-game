<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ແຕ້ມຮູບ · Free Draw</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: linear-gradient(180deg, #fce7f3, #ddd6fe, #dbeafe);
      font-family: 'Noto Sans Lao', 'Segoe UI', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      color: #1e293b;
      overscroll-behavior: none;
    }
    .fd-wrap { max-width: 480px; margin: 0 auto; padding: 8px; }

    .fd-header {
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
      color: #fff; padding: 14px 16px; border-radius: 14px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 12px rgba(139,92,246,0.35); margin-bottom: 10px;
    }
    .fd-title { font-size: 1.15rem; font-weight: 800; letter-spacing: .5px; }
    .fd-header a { color: #fff; text-decoration: none; background: rgba(255,255,255,.22);
                   padding: 6px 12px; border-radius: 20px; font-size: .85rem; }

    /* Toolbar */
    .fd-tools {
      background: #fff; border-radius: 12px; padding: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 8px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .fd-tool-row {
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    }
    .fd-tool-row .lbl {
      font-size: 10px; color: #94a3b8; text-transform: uppercase;
      letter-spacing: 1px; font-weight: 800; padding-right: 4px;
      min-width: 38px;
    }
    .fd-swatch {
      width: 30px; height: 30px; border-radius: 50%;
      border: 3px solid transparent; cursor: pointer;
      flex-shrink: 0; position: relative;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
      transition: transform .12s;
    }
    .fd-swatch:active { transform: scale(.9); }
    .fd-swatch.active { border-color: #1e293b; transform: scale(1.15); box-shadow: 0 0 0 2px #fbbf24, 0 2px 6px rgba(0,0,0,.2); }
    .fd-swatch.white { border-color: #cbd5e1; }
    .fd-swatch.white.active { border-color: #1e293b; }
    .fd-swatch.custom {
      background: linear-gradient(135deg, #ef4444, #f59e0b, #22c55e, #3b82f6, #8b5cf6, #ec4899);
      overflow: hidden;
    }
    .fd-swatch.custom .plus {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 900; font-size: 1rem;
      text-shadow: 0 1px 3px rgba(0,0,0,.7);
      pointer-events: none;
    }
    .fd-swatch.custom input[type="color"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
      border: none; padding: 0;
    }

    .fd-size {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 10px;
      background: #f1f5f9; border: 2px solid transparent;
      cursor: pointer; flex-shrink: 0;
      transition: transform .12s;
    }
    .fd-size:active { transform: scale(.9); }
    .fd-size.active { border-color: #8b5cf6; background: #ede9fe; }
    .fd-size .dot { background: #1e293b; border-radius: 50%; }

    .fd-tool-btn {
      display: flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; border-radius: 10px;
      background: #f1f5f9; border: 2px solid transparent;
      cursor: pointer; font-size: 1.2rem;
      flex-shrink: 0; font-family: inherit; position: relative;
    }
    .fd-tool-btn:active { transform: scale(.9); }
    .fd-tool-btn.active { border-color: #8b5cf6; background: #ede9fe; }
    .fd-tool-btn input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }

    /* Background-image controls (shown only when an image is loaded) */
    .fd-bg-row {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border-radius: 12px; padding: 8px 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 8px;
      display: none;
      align-items: center; gap: 8px;
    }
    .fd-bg-row.show { display: flex; }
    .fd-bg-row .lbl {
      font-size: 1rem; flex-shrink: 0;
    }
    .fd-bg-row input[type="range"] {
      flex: 1; min-width: 0;
      accent-color: #c2410c;
    }
    .fd-bg-row .pct {
      font-size: .8rem; font-weight: 700; color: #92400e;
      min-width: 38px; text-align: right;
    }
    .fd-bg-row .bg-clear {
      border: none; background: #ef4444; color: #fff;
      width: 30px; height: 30px; border-radius: 50%;
      cursor: pointer; font-weight: 900;
      box-shadow: 0 2px 4px rgba(239,68,68,.3);
    }
    .fd-bg-row .bg-clear:active { transform: scale(.9); }

    /* Canvas */
    .fd-canvas-wrap {
      background: #fff; border-radius: 16px; padding: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 8px;
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }
    .fd-canvas-wrap::before {
      content: ''; position: absolute; inset: 6px;
      border-radius: 12px;
      background:
        linear-gradient(45deg, #f8fafc 25%, transparent 25%) -1px 0/20px 20px,
        linear-gradient(-45deg, #f8fafc 25%, transparent 25%) -1px 0/20px 20px,
        #ffffff;
      pointer-events: none;
      z-index: 0;
    }
    /* Stage gets the zoom/pan transform; both canvases ride along inside it. */
    .fd-stage {
      position: absolute; inset: 6px;
      transform-origin: 0 0;
      will-change: transform;
      z-index: 1;
    }
    #bg-canvas, #canvas {
      position: absolute; inset: 0;
      display: block; width: 100%; height: 100%;
      border-radius: 12px;
      touch-action: none;
    }
    #bg-canvas { pointer-events: none; z-index: 1; }
    #canvas    { z-index: 2; background: transparent; }

    /* Zoom controls — floating top-right inside canvas wrap */
    .fd-zoom-controls {
      position: absolute; top: 12px; right: 12px;
      z-index: 10;
      display: flex; flex-direction: column; gap: 4px;
    }
    .fd-zoom-controls button {
      width: 34px; height: 34px; border-radius: 50%;
      border: none; background: rgba(255,255,255,.92);
      color: #475569; font-size: 1.05rem; font-weight: 900;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
      backdrop-filter: blur(2px);
    }
    .fd-zoom-controls button:active { transform: scale(.9); }
    .fd-zoom-controls .reset { font-size: .8rem; color: #8b5cf6; }
    .fd-zoom-indicator {
      position: absolute; bottom: 12px; left: 12px;
      z-index: 10;
      background: rgba(255,255,255,.92);
      color: #475569; font-size: .75rem; font-weight: 800;
      padding: 4px 10px; border-radius: 99px;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
      pointer-events: none; opacity: 0;
      transition: opacity .25s;
    }
    .fd-zoom-indicator.show { opacity: 1; }

    /* Action bar */
    .fd-actions {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    }
    .fd-action {
      padding: 12px; border-radius: 12px; border: none;
      background: #fff; color: #475569;
      font-size: .9rem; font-weight: 800; font-family: inherit;
      cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.08);
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .fd-action:active { transform: translateY(2px); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .fd-action.undo  { color: #6366f1; }
    .fd-action.clear { color: #ef4444; }
    .fd-action.save  { color: #fff; background: linear-gradient(135deg, #10b981, #059669); }
    .fd-action:disabled { opacity: .35; cursor: not-allowed; }

    /* Busy overlay (during flood fill) */
    .fd-busy {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center; z-index: 60;
      background: rgba(0,0,0,.2); backdrop-filter: blur(1px);
      pointer-events: none;
    }
    .fd-busy.show { display: flex; }
    .fd-busy .ring {
      width: 48px; height: 48px; border: 5px solid #fff;
      border-top-color: #8b5cf6; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal */
    .fd-modal {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center; padding: 16px;
      background: rgba(15,23,42,0.7); backdrop-filter: blur(4px); z-index: 50;
    }
    .fd-modal.show { display: flex; }
    .fd-modal-card {
      background: #fff; border-radius: 18px; padding: 22px 24px;
      max-width: 92%; min-width: 280px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .fd-modal-card h2 { margin: 0 0 8px; color: #be185d; font-size: 1.3rem; }
    .fd-modal-card p { margin: 6px 0 16px; color: #475569; font-size: .9rem; }
    .fd-modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .fd-modal-btn {
      padding: 12px; border-radius: 12px; border: none;
      font-size: .95rem; font-weight: 800; font-family: inherit;
      cursor: pointer;
    }
    .fd-modal-btn.cancel { background: #f1f5f9; color: #475569; }
    .fd-modal-btn.confirm { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
  </style>
</head>
<body>
  <div class="fd-wrap">
    <div class="fd-header">
      <div class="fd-title" id="hdr-title">🎨 ແຕ້ມຮູບອິດສະຫຼະ</div>
      <a href="index.html" id="hdr-back">← ໜ້າຫຼັກ</a>
    </div>

    <div class="fd-tools">
      <div class="fd-tool-row" id="row-colors">
        <span class="lbl" id="lbl-color">ສີ</span>
      </div>
      <div class="fd-tool-row">
        <span class="lbl" id="lbl-size">ໜາ</span>
        <div class="fd-size" data-size="4"><span class="dot" style="width:4px;height:4px;"></span></div>
        <div class="fd-size" data-size="10"><span class="dot" style="width:10px;height:10px;"></span></div>
        <div class="fd-size active" data-size="18"><span class="dot" style="width:18px;height:18px;"></span></div>
        <div class="fd-size" data-size="30"><span class="dot" style="width:26px;height:26px;"></span></div>
        <span class="lbl" id="lbl-tool" style="margin-left:auto;">ເຄື່ອງ</span>
        <button class="fd-tool-btn active" id="tool-pen"    title="Pen">✏️</button>
        <button class="fd-tool-btn"        id="tool-eraser" title="Eraser">🧽</button>
        <button class="fd-tool-btn"        id="tool-fill"   title="Fill bucket">🪣</button>
        <label class="fd-tool-btn"          id="tool-image"  title="Add image">🖼️
          <input type="file" id="img-input" accept="image/*">
        </label>
      </div>
    </div>

    <div class="fd-bg-row" id="bg-row">
      <span class="lbl">🖼️</span>
      <input type="range" id="bg-opacity" min="5" max="100" value="35">
      <span class="pct" id="bg-pct">35%</span>
      <button class="bg-clear" id="bg-clear" aria-label="Remove background">✕</button>
    </div>

    <div class="fd-canvas-wrap" id="canvas-wrap">
      <div class="fd-stage" id="stage">
        <canvas id="bg-canvas"></canvas>
        <canvas id="canvas"></canvas>
      </div>
      <div class="fd-zoom-controls">
        <button id="zoom-in"    title="Zoom in">+</button>
        <button id="zoom-out"   title="Zoom out">−</button>
        <button class="reset" id="zoom-reset" title="Reset zoom">1×</button>
      </div>
      <div class="fd-zoom-indicator" id="zoom-pct">100%</div>
    </div>

    <div class="fd-actions">
      <button class="fd-action undo"  id="btn-undo"  disabled>↶ <span id="btn-undo-lbl">ຍ້ອນກັບ</span></button>
      <button class="fd-action clear" id="btn-clear">🗑 <span id="btn-clear-lbl">ລ້າງ</span></button>
      <button class="fd-action save"  id="btn-save">💾 <span id="btn-save-lbl">ບັນທຶກ</span></button>
    </div>
  </div>

  <div class="fd-busy" id="busy"><div class="ring"></div></div>

  <div class="fd-modal" id="modal-clear">
    <div class="fd-modal-card">
      <h2 id="clear-title">ລ້າງຮູບ?</h2>
      <p id="clear-text">ຮູບທີ່ແຕ້ມໄວ້ຈະຫາຍໝົດ. ແນ່ໃຈບໍ່?</p>
      <div class="fd-modal-actions">
        <button class="fd-modal-btn cancel"  id="clear-cancel">ຍົກເລີກ</button>
        <button class="fd-modal-btn confirm" id="clear-confirm">ລ້າງ</button>
      </div>
    </div>
  </div>

  <script src="js/free-draw.js"></script>
</body>
</html>

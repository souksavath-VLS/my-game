<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Slither Pro</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #181818;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .slither-title {
      font-size: 1.6em;
      margin: 14px 0 4px;
      color: #00ff99;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #00ff99;
    }

    .slither-statusbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      font-size: 1rem;
      margin-bottom: 8px;
      flex-wrap: wrap;
      padding: 0 12px;
    }
    .slither-statusbar .pill {
      background: rgba(0, 255, 153, 0.12);
      border: 1px solid rgba(0, 255, 153, 0.4);
      padding: 4px 12px;
      border-radius: 14px;
    }

    /* JS sets --cols / --rows */
    #slither-board {
      display: grid;
      grid-template-columns: repeat(var(--cols, 30), 1fr);
      grid-template-rows: repeat(var(--rows, 30), 1fr);
      aspect-ratio: var(--cols, 30) / var(--rows, 30);
      gap: 1px;
      margin: 4px auto;
      background: #222;
      border: 3px solid #00ff99;
      border-radius: 6px;
      box-shadow: 0 0 20px rgba(0, 255, 153, 0.5);
      width: min(500px, 92vw, 60vh);
      max-width: 100vw;
      box-sizing: border-box;
      position: relative;
      touch-action: none;
    }
    .slither-cell {
      background: #222;
      border-radius: 3px;
      min-width: 0;
      min-height: 0;
    }
    .slither-head     { background: #fff700; border-radius: 50%; box-shadow: 0 0 6px #fff700; }
    .slither-body     { background: #ffe066; border-radius: 50%; }
    .slither-bot-head { background: #00eaff; border-radius: 50%; box-shadow: 0 0 6px #00eaff; }
    .slither-bot-body { background: #7eeeff; border-radius: 50%; }
    .slither-food     { background: #ff4081; border-radius: 50%; box-shadow: 0 0 5px #ff4081; }
    .slither-bonus    {
      background: #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffd700;
      animation: bonusPulse 0.6s infinite alternate;
    }
    @keyframes bonusPulse {
      from { transform: scale(1); }
      to   { transform: scale(1.25); }
    }

    /* Controls */
    .slither-btn {
      padding: 10px 20px;
      font-size: 1.15em;
      background: linear-gradient(135deg, #00ff99, #fff700);
      color: #222;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 0 rgba(0, 180, 100, 0.6);
      cursor: pointer;
      font-weight: bold;
      min-width: 60px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .slither-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 180, 100, 0.6); }
    .slither-btn.secondary {
      background: #4a6a8a;
      color: white;
      box-shadow: 0 4px 0 rgba(40, 80, 120, 0.6);
    }
    #start-slither-btn {
      margin-top: 12px;
      padding: 12px 28px;
      font-size: 1.1em;
    }

    /* Floating buttons */
    #slither-exit-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 30;
      padding: 8px 14px;
      background: #ff4444;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95em;
    }
    #slither-mute-btn, #slither-pause-btn {
      position: fixed;
      top: 10px;
      z-index: 30;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      border: 2px solid rgba(0, 255, 153, 0.4);
      font-size: 1.2em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #slither-mute-btn  { right: 10px; }
    #slither-pause-btn { right: 60px; }

    /* Overlays */
    .slither-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .slither-card {
      background: linear-gradient(145deg, #1e3a3a, #0d1f1f);
      border: 2px solid #00ff99;
      border-radius: 16px;
      padding: 28px 36px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 30px rgba(0, 255, 153, 0.5);
      animation: cardPop 0.35s ease-out;
    }
    @keyframes cardPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .slither-card h2 {
      margin: 0 0 12px;
      font-size: 1.6em;
      color: #00ff99;
      text-shadow: 0 0 8px #00ff99;
    }
    .slither-score-big {
      font-size: 2.8em;
      font-weight: bold;
      color: #fff700;
      text-shadow: 0 0 12px #fff700;
      margin: 10px 0;
    }
    #slither-new-record {
      display: inline-block;
      background: #ff5252;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      animation: pulse 0.6s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to   { transform: scale(1.08); }
    }
    .slither-hi-line { color: #ffd700; font-size: 1.05em; margin: 8px 0; }

    @media (max-width: 600px) {
      .slither-title { font-size: 1.3em; margin-top: 10px; }
      .slither-statusbar { font-size: 0.9rem; gap: 10px; }
      .slither-btn { font-size: 1rem; padding: 8px 14px; min-width: 50px; }
      #start-slither-btn { font-size: 1em; padding: 10px 22px; }
      .slither-card { padding: 20px 24px; }
      .slither-card h2 { font-size: 1.3em; }
      .slither-score-big { font-size: 2.2em; }
    }
  </style>
</head>
<body>
  <a id="slither-exit-btn" href="index.html">Exit</a>
  <button id="slither-pause-btn" aria-label="Pause">⏸</button>
  <button id="slither-mute-btn"  aria-label="Mute">🔊</button>

  <div class="slither-title" id="slither-title">Slither Pro</div>

  <div class="slither-statusbar">
    <span class="pill"><span id="label-score">Score:</span> <span id="slither-score">0</span></span>
    <span class="pill">🏆 <span id="label-hi">Best:</span> <span id="slither-highscore">0</span></span>
  </div>

  <div id="slither-board"></div>

  <p id="slither-hint" style="margin: 10px 0 0; opacity: 0.7; font-size: 0.9rem;">Swipe on the board to control</p>

  <button class="slither-btn" id="start-slither-btn">Start Game</button>

  <!-- Pause overlay -->
  <div id="slither-pause-overlay" class="slither-overlay" style="display:none;">
    <div class="slither-card">
      <h2 id="slither-pause-title">Paused</h2>
      <button id="slither-resume-btn" class="slither-btn">Resume</button>
    </div>
  </div>

  <!-- Game over modal -->
  <div id="slither-gameover-modal" class="slither-overlay" style="display:none;">
    <div class="slither-card">
      <h2 id="slither-gameover-title">Game Over</h2>
      <div id="slither-new-record" style="display:none;">NEW RECORD!</div>
      <p id="slither-final-label">Your Score</p>
      <div class="slither-score-big"><span id="slither-final-score">0</span></div>
      <p class="slither-hi-line">🏆 <span id="slither-final-hi-label">Best:</span> <span id="slither-final-hi">0</span></p>
      <button id="slither-playagain-btn" class="slither-btn">Play Again</button>
    </div>
  </div>

  <script src="js/slither.js"></script>
  <script>
    document.getElementById('start-slither-btn').addEventListener('click', () => {
      if (window.slitherResetGame) window.slitherResetGame();
    });

    const slitherLangData = {
      th: {
        title: 'เกมงู',
        score: 'คะแนน:',
        hi: 'สูงสุด:',
        start: 'เริ่มเกม',
        exit: 'ออกเกม',
        paused: 'หยุดชั่วคราว',
        resume: 'เล่นต่อ',
        gameOver: 'จบเกม!',
        newRecord: 'สถิติใหม่!',
        finalLabel: 'คะแนนของคุณ',
        finalHi: 'สูงสุด:',
        playAgain: 'เล่นอีก',
        hint: 'ปัดบนกระดานเพื่อบังคับ'
      },
      en: {
        title: 'Snake Game',
        score: 'Score:',
        hi: 'Best:',
        start: 'Start Game',
        exit: 'Exit',
        paused: 'Paused',
        resume: 'Resume',
        gameOver: 'Game Over!',
        newRecord: 'NEW RECORD!',
        finalLabel: 'Your Score',
        finalHi: 'Best:',
        playAgain: 'Play Again',
        hint: 'Swipe on the board to control'
      },
      lao: {
        title: 'ເກມງູ',
        score: 'ຄະແນນ:',
        hi: 'ສູງສຸດ:',
        start: 'ເລີ່ມເກມ',
        exit: 'ອອກເກມ',
        paused: 'ຢຸດຊົ່ວຄາວ',
        resume: 'ຫຼິ້ນຕໍ່',
        gameOver: 'ຈົບເກມ!',
        newRecord: 'ສະຖິຕິໃໝ່!',
        finalLabel: 'ຄະແນນຂອງເຈົ້າ',
        finalHi: 'ສູງສຸດ:',
        playAgain: 'ຫຼິ້ນອີກ',
        hint: 'ປັດເທິງກະດານເພື່ອບັງຄັບ'
      }
    };

    function setSlitherLang() {
      let lang = localStorage.getItem('lang') || 'en';
      if (!['th', 'en', 'lao'].includes(lang)) lang = 'en';
      const t = slitherLangData[lang];
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
      set('slither-title', t.title);
      set('label-score', t.score);
      set('label-hi', t.hi);
      set('start-slither-btn', t.start);
      set('slither-exit-btn', t.exit);
      set('slither-pause-title', t.paused);
      set('slither-resume-btn', t.resume);
      set('slither-gameover-title', t.gameOver);
      set('slither-new-record', t.newRecord);
      set('slither-final-label', t.finalLabel);
      set('slither-final-hi-label', t.finalHi);
      set('slither-playagain-btn', t.playAgain);
      set('slither-hint', t.hint);
    }
    document.addEventListener('DOMContentLoaded', setSlitherLang);
  </script>
</body>
</html>

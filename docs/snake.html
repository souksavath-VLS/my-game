<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: 'Noto Sans Lao', 'Segoe UI', Arial, sans-serif;
      text-align: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .snake-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12px;
      height: 100vh;
      box-sizing: border-box;
    }
    .snake-title {
      color: #4caf50;
      margin: 0 0 6px;
      font-size: 1.6em;
      letter-spacing: 1px;
      text-shadow: 0 0 6px #4caf5088;
    }
    .snake-statusbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      font-size: 1rem;
      margin-bottom: 8px;
      flex-wrap: wrap;
      padding: 0 10px;
    }
    .snake-statusbar .pill {
      background: rgba(76, 175, 80, 0.12);
      border: 1px solid rgba(76, 175, 80, 0.5);
      padding: 4px 12px;
      border-radius: 14px;
      color: #c8e6c9;
    }

    /* Board uses CSS variables set by JS */
    #snake-board {
      display: grid;
      grid-template-columns: repeat(var(--cols, 21), 1fr);
      grid-template-rows: repeat(var(--rows, 21), 1fr);
      aspect-ratio: var(--cols, 21) / var(--rows, 21);
      gap: 1px;
      background: #111;
      border: 3px solid #4caf50;
      border-radius: 10px;
      box-shadow: 0 0 18px rgba(76, 175, 80, 0.55);
      width: min(450px, 92vw, 60vh);
      max-width: 100vw;
      box-sizing: border-box;
      margin: 0 auto;
      touch-action: none;
    }
    .snake-cell {
      background: #222;
      border-radius: 3px;
      min-width: 0;
      min-height: 0;
    }
    .snake-head  { background: var(--snake-head, #4caf50); border-radius: 50%; box-shadow: 0 0 5px var(--snake-head, #4caf50); }
    .snake-body  { background: var(--snake-body, #81c784); border-radius: 50%; }
    .snake-food  { background: var(--snake-food, #ffeb3b); border-radius: 50%; box-shadow: 0 0 5px var(--snake-food, #ffeb3b); }
    .snake-wall  { background: var(--snake-wall, #616161); border-radius: 4px; }
    .snake-bonus {
      background: var(--snake-bonus, #ff4081);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--snake-bonus, #ff4081);
      animation: snakeBonusPulse 0.6s infinite alternate;
    }
    @keyframes snakeBonusPulse {
      from { transform: scale(1); }
      to   { transform: scale(1.25); }
    }

    /* Buttons */
    .snake-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 12px 0 0;
      flex-wrap: wrap;
    }
    .snake-btn {
      padding: 10px 22px;
      font-size: 1em;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(40, 90, 40, 0.5);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .snake-btn.primary {
      background: linear-gradient(135deg, #4caf50, #fffde7);
      color: #222;
    }
    .snake-btn.secondary {
      background: #333;
      color: #fff;
      box-shadow: 0 4px 0 rgba(20, 20, 20, 0.6);
    }
    .snake-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(40, 90, 40, 0.5); }

    #snake-hint {
      margin: 8px 0 0;
      opacity: 0.7;
      font-size: 0.9rem;
    }

    /* Floating buttons */
    #snake-exit-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 30;
      padding: 8px 14px;
      background: #ff4444;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95em;
    }
    #snake-mute-btn, #snake-pause-btn {
      position: fixed;
      top: 10px;
      z-index: 30;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      border: 2px solid rgba(76, 175, 80, 0.5);
      font-size: 1.2em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #snake-mute-btn  { right: 10px; }
    #snake-pause-btn { right: 60px; }

    /* Overlays */
    .snake-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .snake-card {
      background: linear-gradient(145deg, #1e3a1e, #0d1f0d);
      border: 2px solid #4caf50;
      border-radius: 16px;
      padding: 28px 36px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 30px rgba(76, 175, 80, 0.6);
      animation: snakeCardPop 0.35s ease-out;
    }
    @keyframes snakeCardPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .snake-card h2 {
      margin: 0 0 12px;
      font-size: 1.5em;
      color: #4caf50;
      text-shadow: 0 0 8px #4caf50;
    }
    .snake-score-big {
      font-size: 2.6em;
      font-weight: bold;
      color: #ffeb3b;
      text-shadow: 0 0 12px #ffeb3b;
      margin: 10px 0;
    }
    #snake-new-record {
      display: inline-block;
      background: #ff5252;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      animation: snakePulse 0.6s infinite alternate;
    }
    @keyframes snakePulse {
      from { transform: scale(1); }
      to   { transform: scale(1.08); }
    }
    .snake-hi-line { color: #ffd700; font-size: 1.05em; margin: 8px 0; }

    @media (max-width: 600px) {
      .snake-title { font-size: 1.3em; }
      .snake-statusbar { font-size: 0.9rem; gap: 8px; }
      .snake-btn { font-size: 0.9rem; padding: 8px 16px; }
      .snake-card { padding: 20px 24px; }
      .snake-card h2 { font-size: 1.25em; }
      .snake-score-big { font-size: 2.1em; }
    }
  </style>
</head>
<body>
  <a id="snake-exit-btn" href="index.html">Exit</a>
  <button id="snake-pause-btn" aria-label="Pause">⏸</button>
  <button id="snake-mute-btn"  aria-label="Mute">🔊</button>

  <div class="snake-container">
    <h2 class="snake-title" id="snake-title">Snake Pro</h2>

    <div class="snake-statusbar">
      <span class="pill"><span id="label-score">Score:</span> <span id="snake-score">0</span></span>
      <span class="pill">🏆 <span id="label-hi">Best:</span> <span id="snake-highscore">0</span></span>
    </div>

    <div id="snake-board"></div>

    <p id="snake-hint">Swipe on the board to control</p>

    <div class="snake-actions">
      <button id="start-snake-btn" class="snake-btn primary">Start Game</button>
      <button id="theme-snake-btn" class="snake-btn secondary">Theme</button>
    </div>
  </div>

  <!-- Pause overlay -->
  <div id="snake-pause-overlay" class="snake-overlay" style="display:none;">
    <div class="snake-card">
      <h2 id="snake-pause-title">Paused</h2>
      <button id="snake-resume-btn" class="snake-btn primary">Resume</button>
    </div>
  </div>

  <!-- Game over modal -->
  <div id="snake-gameover-modal" class="snake-overlay" style="display:none;">
    <div class="snake-card">
      <h2 id="snake-gameover-title">Game Over</h2>
      <div id="snake-new-record" style="display:none;">NEW RECORD!</div>
      <p id="snake-final-label">Your Score</p>
      <div class="snake-score-big"><span id="snake-final-score">0</span></div>
      <p class="snake-hi-line">🏆 <span id="snake-final-hi-label">Best:</span> <span id="snake-final-hi">0</span></p>
      <button id="snake-playagain-btn" class="snake-btn primary">Play Again</button>
    </div>
  </div>

  <script src="js/snake.js"></script>
  <script>
    const snakeLangData = {
      th: {
        title: 'เกมงู Pro', score: 'คะแนน:', hi: 'สูงสุด:',
        start: 'เริ่มเกม', theme: 'เปลี่ยนธีม', exit: 'ออกเกม',
        hint: 'ปัดบนกระดานเพื่อบังคับ',
        paused: 'หยุดชั่วคราว', resume: 'เล่นต่อ',
        gameOver: 'จบเกม!', newRecord: 'สถิติใหม่!',
        finalLabel: 'คะแนนของคุณ', finalHi: 'สูงสุด:', playAgain: 'เล่นอีก'
      },
      en: {
        title: 'Snake Pro', score: 'Score:', hi: 'Best:',
        start: 'Start Game', theme: 'Theme', exit: 'Exit',
        hint: 'Swipe on the board to control',
        paused: 'Paused', resume: 'Resume',
        gameOver: 'Game Over', newRecord: 'NEW RECORD!',
        finalLabel: 'Your Score', finalHi: 'Best:', playAgain: 'Play Again'
      },
      lao: {
        title: 'ເກມງູ Pro', score: 'ຄະແນນ:', hi: 'ສູງສຸດ:',
        start: 'ເລີ່ມເກມ', theme: 'ປ່ຽນທີມ', exit: 'ອອກເກມ',
        hint: 'ປັດເທິງກະດານເພື່ອບັງຄັບ',
        paused: 'ຢຸດຊົ່ວຄາວ', resume: 'ຫຼິ້ນຕໍ່',
        gameOver: 'ຈົບເກມ!', newRecord: 'ສະຖິຕິໃໝ່!',
        finalLabel: 'ຄະແນນຂອງເຈົ້າ', finalHi: 'ສູງສຸດ:', playAgain: 'ຫຼິ້ນອີກ'
      }
    };
    function setSnakeLang() {
      let lang = localStorage.getItem('lang') || 'en';
      if (!['th', 'en', 'lao'].includes(lang)) lang = 'en';
      const t = snakeLangData[lang];
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
      set('snake-title', t.title);
      set('label-score', t.score);
      set('label-hi', t.hi);
      set('start-snake-btn', t.start);
      set('theme-snake-btn', t.theme);
      set('snake-exit-btn', t.exit);
      set('snake-hint', t.hint);
      set('snake-pause-title', t.paused);
      set('snake-resume-btn', t.resume);
      set('snake-gameover-title', t.gameOver);
      set('snake-new-record', t.newRecord);
      set('snake-final-label', t.finalLabel);
      set('snake-final-hi-label', t.finalHi);
      set('snake-playagain-btn', t.playAgain);
    }
    document.addEventListener('DOMContentLoaded', setSnakeLang);
  </script>
</body>
</html>

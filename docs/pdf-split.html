<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ແຍກ PDF · PDF Split</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: linear-gradient(180deg, #ede9fe, #fce7f3);
      font-family: 'Noto Sans Lao', 'Segoe UI', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      color: #1e293b;
      overscroll-behavior: none;
    }
    .ps-wrap { max-width: 720px; margin: 0 auto; padding: 8px 10px 40px; }

    .ps-hdr {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: #fff; padding: 14px 16px; border-radius: 14px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 12px rgba(139,92,246,0.35); margin-bottom: 10px;
    }
    .ps-title { font-size: 1.1rem; font-weight: 900; }
    .ps-hdr a {
      color: #fff; text-decoration: none; background: rgba(255,255,255,.22);
      padding: 6px 12px; border-radius: 20px; font-size: .85rem;
    }

    /* Drop zone */
    .ps-drop {
      background: #fff; border: 3px dashed #c4b5fd; border-radius: 14px;
      padding: 20px 16px; text-align: center;
      margin-bottom: 10px; transition: all .15s;
    }
    .ps-drop.dragover { border-color: #6d28d9; background: #ede9fe; transform: scale(1.01); }
    .ps-drop .em { font-size: 2.4rem; line-height: 1; display: block; margin-bottom: 6px; }
    .ps-drop .hint { color: #94a3b8; font-size: .85rem; margin-bottom: 10px; }
    .ps-drop label {
      padding: 9px 16px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: #fff; font-size: .88rem; font-weight: 800;
      cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; gap: 5px;
      position: relative; overflow: hidden;
    }
    .ps-drop label:active { transform: translateY(2px); }
    .ps-drop input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }

    /* File info card */
    .ps-info {
      background: #fff; border-radius: 12px; padding: 12px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 10px;
      display: none;
      align-items: center; gap: 10px;
      position: relative; overflow: hidden;
    }
    .ps-info.show { display: flex; }
    .ps-info::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: linear-gradient(180deg, #8b5cf6, #6d28d9);
    }
    .ps-info .em { font-size: 1.6rem; margin-left: 6px; }
    .ps-info .body { flex: 1; min-width: 0; }
    .ps-info .name {
      font-weight: 800; font-size: .92rem; color: #1e293b;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ps-info .meta { font-size: .72rem; color: #64748b; margin-top: 2px; }

    /* Mode tabs */
    .ps-tabs {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px;
      background: #fff; border-radius: 12px; padding: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 10px;
    }
    .ps-tab {
      padding: 9px 6px; border: none; border-radius: 8px;
      font-family: inherit; font-size: .82rem; font-weight: 800;
      background: transparent; color: #94a3b8; cursor: pointer;
      transition: all .15s;
    }
    .ps-tab.active {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: #fff; box-shadow: 0 2px 6px rgba(139,92,246,.4);
    }

    /* Mode controls */
    .ps-mode-ctrl {
      background: #fff; border-radius: 12px; padding: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 10px;
      display: none;
    }
    .ps-mode-ctrl.show { display: block; }
    .ps-mode-ctrl .lbl {
      font-size: .8rem; color: #64748b; font-weight: 700;
      margin-bottom: 6px;
    }
    .ps-input {
      width: 100%; padding: 10px 12px;
      border: 2px solid #e2e8f0; border-radius: 10px;
      font-family: 'Courier New', monospace; font-size: .95rem;
      color: #1e293b; outline: none;
    }
    .ps-input:focus { border-color: #8b5cf6; }
    .ps-hint {
      font-size: .72rem; color: #94a3b8; margin-top: 6px; line-height: 1.4;
    }
    .ps-hint code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }
    .ps-summary {
      background: #ede9fe; color: #6d28d9;
      padding: 6px 10px; border-radius: 8px;
      font-size: .82rem; font-weight: 800; margin-top: 8px;
      display: none;
    }
    .ps-summary.show { display: block; }
    .ps-summary.error { background: #fee2e2; color: #991b1b; }

    .ps-select-actions {
      display: flex; gap: 6px; margin-top: 6px;
    }
    .ps-select-actions button {
      flex: 1; padding: 8px; border-radius: 8px; border: none;
      background: #f1f5f9; color: #475569;
      font-family: inherit; font-size: .82rem; font-weight: 800;
      cursor: pointer;
    }
    .ps-select-actions button:active { transform: scale(.95); }

    /* Thumbnails */
    .ps-list-hdr {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 8px 8px; font-weight: 900; font-size: .95rem; color: #475569;
    }
    .ps-list-hdr .count {
      background: #fff; color: #94a3b8; font-size: .72rem; padding: 2px 8px;
      border-radius: 99px; font-weight: 800; margin-left: auto;
    }
    .ps-thumbs {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 6px; margin-bottom: 10px;
    }
    .ps-thumb {
      background: #fff; border-radius: 10px; padding: 4px;
      position: relative; overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      border: 2px solid transparent;
      cursor: pointer;
      transition: all .15s;
    }
    .ps-thumb:active { transform: scale(.95); }
    .ps-thumb.selected {
      border-color: #8b5cf6;
      background: linear-gradient(135deg, #ede9fe, #ffffff);
      box-shadow: 0 0 0 2px rgba(139,92,246,.3);
    }
    .ps-thumb.in-range {
      border-color: #f59e0b;
      background: linear-gradient(135deg, #fef3c7, #ffffff);
    }
    .ps-thumb .img {
      aspect-ratio: 1 / 1.3;
      background: #f8fafc; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .ps-thumb canvas {
      width: 100%; height: 100%; object-fit: contain;
    }
    .ps-thumb .num {
      position: absolute; top: 6px; left: 6px;
      background: rgba(0,0,0,.7); color: #fff;
      font-size: .68rem; font-weight: 900;
      padding: 2px 6px; border-radius: 99px;
    }
    .ps-thumb .check {
      position: absolute; top: 6px; right: 6px;
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(255,255,255,.95); color: #94a3b8;
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem; font-weight: 900;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
      opacity: 0; transition: opacity .15s;
    }
    .ps-thumb.selected .check {
      opacity: 1; background: #8b5cf6; color: #fff;
    }
    .ps-thumb.in-range .check {
      opacity: 1; background: #f59e0b; color: #fff;
    }

    /* Progress */
    .ps-progress {
      display: none;
      background: #fff; border-radius: 12px; padding: 14px;
      margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
      text-align: center;
    }
    .ps-progress.show { display: block; }
    .ps-progress .bar {
      height: 8px; background: #f1f5f9; border-radius: 99px;
      margin: 8px 0; overflow: hidden;
    }
    .ps-progress .bar > div {
      height: 100%; background: linear-gradient(90deg, #8b5cf6, #6d28d9);
      transition: width .25s; width: 0%;
    }
    .ps-progress .lbl { font-size: .85rem; font-weight: 700; color: #475569; }

    /* Actions */
    .ps-actions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    }
    .ps-actions button {
      padding: 14px; border-radius: 12px; border: none;
      font-size: .95rem; font-weight: 900; font-family: inherit;
      cursor: pointer; color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .ps-actions button:active { transform: translateY(2px); }
    .ps-actions button:disabled { opacity: .4; cursor: not-allowed; }
    .ps-actions .clear { background: linear-gradient(135deg, #94a3b8, #64748b); }
    .ps-actions .gen   { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }

    /* Empty */
    .ps-empty {
      text-align: center; padding: 24px 12px; color: #94a3b8;
      font-style: italic; font-size: .9rem;
    }

    /* Toast */
    .ps-toast {
      position: fixed; left: 50%; bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15,23,42,.92); color: #fff;
      padding: 10px 18px; border-radius: 99px;
      font-size: .85rem; font-weight: 700;
      box-shadow: 0 6px 18px rgba(0,0,0,.3);
      opacity: 0; pointer-events: none;
      transition: all .25s; z-index: 100;
    }
    .ps-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Modal */
    .ps-modal {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center; padding: 16px;
      background: rgba(15,23,42,.7); backdrop-filter: blur(4px); z-index: 200;
    }
    .ps-modal.show { display: flex; }
    .ps-modal-card {
      background: #fff; border-radius: 18px; padding: 22px 24px;
      max-width: 92%; min-width: 280px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .ps-modal-card h2 { margin: 0 0 8px; color: #6d28d9; font-size: 1.2rem; }
    .ps-modal-card p { margin: 6px 0 16px; color: #475569; font-size: .9rem; line-height: 1.5; }
    .ps-modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .ps-modal-btn {
      padding: 12px; border-radius: 12px; border: none;
      font-size: .95rem; font-weight: 800; font-family: inherit;
      cursor: pointer;
    }
    .ps-modal-btn.cancel  { background: #f1f5f9; color: #475569; }
    .ps-modal-btn.confirm { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
  </style>
</head>
<body>
  <div class="ps-wrap">
    <div class="ps-hdr">
      <div class="ps-title" id="hdr-title">📄✂️ ແຍກ PDF</div>
      <a href="index.html" id="hdr-back">← ໜ້າຫຼັກ</a>
    </div>

    <div class="ps-drop" id="drop">
      <span class="em">📄</span>
      <div class="hint" id="drop-hint">ກົດເລືອກ ຫຼື ລາກ PDF ມາວາງ<br><span style="font-size:.75rem;">(1 ໄຟລ໌)</span></div>
      <label id="btn-pick">📁 <span id="btn-pick-lbl">ເລືອກ PDF</span>
        <input type="file" id="file-input" accept="application/pdf,.pdf">
      </label>
    </div>

    <div class="ps-info" id="info">
      <span class="em">📄</span>
      <div class="body">
        <div class="name" id="info-name">—</div>
        <div class="meta" id="info-meta">—</div>
      </div>
    </div>

    <div class="ps-tabs" id="tabs" style="display:none;">
      <button class="ps-tab active" data-mode="select" id="tab-select">👆 <span id="tab-select-lbl">ເລືອກໜ້າ</span></button>
      <button class="ps-tab"        data-mode="range"  id="tab-range">🔢 <span id="tab-range-lbl">ໄລຍະ</span></button>
      <button class="ps-tab"        data-mode="all"    id="tab-all">📑 <span id="tab-all-lbl">ທຸກໜ້າ</span></button>
    </div>

    <div class="ps-mode-ctrl" id="ctrl-select">
      <div class="lbl" id="lbl-select">👆 <span id="lbl-select-text">ກົດໜ້າທີ່ຕ້ອງການ — ຈະບັນທຶກເປັນ PDF ດຽວ</span></div>
      <div class="ps-select-actions">
        <button id="sel-all"><span id="sel-all-lbl">ເລືອກໝົດ</span></button>
        <button id="sel-none"><span id="sel-none-lbl">ຍົກເລີກໝົດ</span></button>
        <button id="sel-invert"><span id="sel-invert-lbl">ກັບກັນ</span></button>
      </div>
      <div class="ps-summary show" id="select-summary">—</div>
    </div>

    <div class="ps-mode-ctrl" id="ctrl-range">
      <div class="lbl" id="lbl-range">🔢 <span id="lbl-range-text">ພິມໄລຍະໜ້າ ແຕ່ລະຊຸດແຍກໄຟລ໌</span></div>
      <input class="ps-input" id="range-input" placeholder="1-3, 5, 7-9">
      <div class="ps-hint" id="range-hint">
        <span id="range-hint-text">ຕົວຢ່າງ:</span> <code>1-3, 5, 7-9</code> → 3 PDF (.zip)
      </div>
      <div class="ps-summary" id="range-summary"></div>
    </div>

    <div class="ps-mode-ctrl" id="ctrl-all">
      <div class="lbl" id="lbl-all">📑 <span id="lbl-all-text">ແຍກທຸກໜ້າເປັນໄຟລ໌ແຍກ — ບີບໄວ້ໃນ .zip</span></div>
      <div class="ps-summary show" id="all-summary">—</div>
    </div>

    <div class="ps-list-hdr" id="list-hdr" style="display:none;">
      <span>🖼️</span>
      <span id="lbl-pages-hdr">ໜ້າຕ່າງໆ</span>
      <span class="count" id="pages-count">0</span>
    </div>

    <div class="ps-thumbs" id="thumbs"></div>
    <div class="ps-empty" id="empty" style="display:none;" data-i18n="empty">ກົດເລືອກ PDF ກ່ອນ</div>

    <div class="ps-progress" id="progress">
      <div class="lbl" id="progress-lbl">ກຳລັງແຍກ...</div>
      <div class="bar"><div id="progress-bar"></div></div>
    </div>

    <div class="ps-actions">
      <button class="clear" id="btn-clear" disabled>🗑 <span id="btn-clear-lbl">ລ້າງ</span></button>
      <button class="gen"   id="btn-gen"   disabled>📄 <span id="btn-gen-lbl">ແຍກ PDF</span></button>
    </div>
  </div>

  <div class="ps-toast" id="toast"></div>

  <div class="ps-modal" id="modal-clear">
    <div class="ps-modal-card">
      <h2 id="clear-title">⚠️</h2>
      <p id="clear-text">ລ້າງ PDF ປັດຈຸບັນ?</p>
      <div class="ps-modal-actions">
        <button class="ps-modal-btn cancel"  id="clear-cancel">ຍົກເລີກ</button>
        <button class="ps-modal-btn confirm" id="clear-confirm">ລ້າງ</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/pdf-split.js"></script>
</body>
</html>

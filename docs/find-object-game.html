<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>หาสิ่งของในบ้าน · Find Object</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: linear-gradient(180deg, #fef3c7, #fbcfe8);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }
    .fo-wrap { max-width: 480px; margin: 0 auto; padding: 8px; }

    .fo-header {
      background: linear-gradient(135deg, #d946ef, #a21caf);
      color: #fff; padding: 14px 16px; border-radius: 14px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 12px rgba(217,70,239,0.3); margin-bottom: 10px;
    }
    .fo-title { font-size: 1.15rem; font-weight: 800; letter-spacing: .5px; }
    .fo-header a { color: #fff; text-decoration: none; background: rgba(255,255,255,.22);
                   padding: 6px 12px; border-radius: 20px; font-size: .85rem; }

    .fo-hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .fo-stat { background: #fff; border-radius: 10px; padding: 8px 4px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .fo-stat .lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .fo-stat .val { font-size: 18px; font-weight: 900; color: #1e293b; line-height: 1.1; }
    .fo-stat .val.level { color: #d946ef; }
    .fo-stat .val.score { color: #2563eb; }
    .fo-stat .val.lives { color: #ef4444; letter-spacing: 0; }
    .fo-stat .val.best { color: #b45309; }

    /* Target card */
    .fo-target {
      background: #fff; border-radius: 16px; padding: 16px 14px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08); margin-bottom: 10px;
      text-align: center; position: relative;
    }
    .fo-target .lbl {
      font-size: 10px; color: #94a3b8; text-transform: uppercase;
      letter-spacing: 1px; font-weight: 700; margin-bottom: 4px;
    }
    .fo-target .name {
      font-size: 1.8rem; font-weight: 900; color: #1e293b;
      font-family: 'Noto Sans Lao', 'Segoe UI', sans-serif;
      line-height: 1.1;
    }
    .fo-target .sub {
      font-size: .82rem; color: #64748b; margin-top: 4px;
      font-family: 'Noto Sans Lao', 'Segoe UI', sans-serif;
    }
    .fo-speak {
      position: absolute; top: 12px; right: 12px;
      background: #fef3c7; border: 2px solid #f59e0b;
      width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
    }
    .fo-speak:active { transform: scale(.9); }

    /* Options */
    .fo-options {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
      margin-bottom: 10px;
    }
    .fo-opt {
      aspect-ratio: 1.4 / 1;
      background: #fff; border-radius: 14px;
      border: 3px solid #cbd5e1;
      cursor: pointer; text-align: center;
      box-shadow: 0 4px 0 rgba(0,0,0,.1);
      transition: transform .12s;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
    }
    .fo-opt:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.1); }
    .fo-opt.correct { background: #10b981; border-color: #059669; animation: pop .4s; }
    .fo-opt.wrong { background: #ef4444; border-color: #b91c1c; animation: shake .3s; }
    .fo-opt.dim { opacity: .35; }
    @keyframes pop {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* When 6 options (higher levels) */
    .fo-options.three-col { grid-template-columns: repeat(3, 1fr); }
    .fo-options.three-col .fo-opt { font-size: 2.4rem; aspect-ratio: 1 / 1; }

    /* Flash */
    .fo-flash {
      position: fixed; left: 50%; top: 35%; transform: translate(-50%, -50%) scale(.5);
      padding: 16px 28px; border-radius: 14px;
      background: linear-gradient(135deg, #d946ef, #a21caf);
      color: #fff; font-size: 1.6rem; font-weight: 900;
      opacity: 0; pointer-events: none; z-index: 30;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }
    .fo-flash.show { animation: flashPop 1s ease-out; }
    @keyframes flashPop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
      30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      80%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }

    /* Modal */
    .fo-modal {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(15,23,42,0.7); backdrop-filter: blur(4px); z-index: 20;
    }
    .fo-modal.show { display: flex; }
    .fo-modal-card {
      background: #fff; border-radius: 18px; padding: 24px 28px;
      max-width: 92%; min-width: 280px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .fo-modal-card h2 { margin: 0 0 8px; color: #a21caf; font-size: 1.5rem; }
    .fo-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .fo-stats-grid .cell { background: #fce7f3; padding: 10px; border-radius: 10px; }
    .fo-stats-grid .lbl { font-size: 10px; color: #a21caf; text-transform: uppercase; font-weight: 700; }
    .fo-stats-grid .val { font-size: 1.4rem; font-weight: 900; color: #1e293b; }
    .new-best {
      display: inline-block; background: #fde68a; color: #92400e;
      font-weight: 900; font-size: .8rem; padding: 3px 12px;
      border-radius: 99px; margin-bottom: 8px; box-shadow: 0 0 12px rgba(251,191,36,.5);
    }
    .fo-btn {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #d946ef, #a21caf);
      color: #fff; font-size: 1rem; font-weight: 800; letter-spacing: .5px;
      cursor: pointer; box-shadow: 0 4px 12px rgba(217,70,239,.35);
    }
    .fo-btn:active { transform: translateY(2px); box-shadow: 0 2px 6px rgba(217,70,239,.35); }

    @media (max-width: 380px) {
      .fo-target .name { font-size: 1.5rem; }
      .fo-opt { font-size: 2.4rem; }
      .fo-options.three-col .fo-opt { font-size: 2rem; }
      .fo-stat .val { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="fo-wrap">
    <div class="fo-header">
      <div class="fo-title" id="hdr-title">🏠 หาสิ่งของในบ้าน</div>
      <a href="index.html" id="hdr-back">← หน้าหลัก</a>
    </div>

    <div class="fo-hud">
      <div class="fo-stat"><div class="lbl" id="lbl-level">เลเวล</div><div class="val level" id="ui-level">1</div></div>
      <div class="fo-stat"><div class="lbl" id="lbl-score">คะแนน</div><div class="val score" id="ui-score">0</div></div>
      <div class="fo-stat"><div class="lbl" id="lbl-lives">หัวใจ</div><div class="val lives" id="ui-lives">❤❤❤❤❤</div></div>
      <div class="fo-stat"><div class="lbl" id="lbl-best">ดีที่สุด</div><div class="val best" id="ui-best">0</div></div>
    </div>

    <div class="fo-target">
      <button class="fo-speak" id="btn-speak" aria-label="Pronounce">🔊</button>
      <div class="lbl" id="target-lbl">หา</div>
      <div class="name" id="target-name">ช้อน</div>
      <div class="sub" id="target-sub">Spoon · ບ່ວງ</div>
    </div>

    <div class="fo-options" id="options"></div>
  </div>

  <div class="fo-flash" id="flash">เลเวล 2!</div>

  <div class="fo-modal" id="modal-over">
    <div class="fo-modal-card">
      <div class="new-best" id="newbest" style="display:none">⭐ NEW BEST!</div>
      <h2 id="over-title">จบเกม</h2>
      <div class="fo-stats-grid">
        <div class="cell">
          <div class="lbl" id="over-lbl-score">คะแนน</div>
          <div class="val" id="over-score">0</div>
        </div>
        <div class="cell">
          <div class="lbl" id="over-lbl-level">เลเวล</div>
          <div class="val" id="over-level">1</div>
        </div>
      </div>
      <button class="fo-btn" id="btn-again">▶ เล่นใหม่</button>
    </div>
  </div>

  <script src="js/find-object-game.js"></script>
</body>
</html>

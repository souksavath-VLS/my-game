<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เปรียบเทียบ · Big-Small / Top-Bottom</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: linear-gradient(180deg, #fae8ff, #e0f2fe);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }
    .bs-wrap { max-width: 480px; margin: 0 auto; padding: 8px; }

    .bs-header {
      background: linear-gradient(135deg, #a855f7, #7e22ce);
      color: #fff; padding: 14px 16px; border-radius: 14px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 12px rgba(168,85,247,0.3); margin-bottom: 10px;
    }
    .bs-title { font-size: 1.15rem; font-weight: 800; letter-spacing: .5px; }
    .bs-header a { color: #fff; text-decoration: none; background: rgba(255,255,255,.22);
                   padding: 6px 12px; border-radius: 20px; font-size: .85rem; }

    .bs-hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .bs-stat { background: #fff; border-radius: 10px; padding: 8px 4px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .bs-stat .lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .bs-stat .val { font-size: 18px; font-weight: 900; color: #1e293b; line-height: 1.1; }
    .bs-stat .val.level { color: #a855f7; }
    .bs-stat .val.score { color: #2563eb; }
    .bs-stat .val.lives { color: #ef4444; letter-spacing: 0; }
    .bs-stat .val.best { color: #b45309; }

    /* Question */
    .bs-question {
      background: #fff; border-radius: 14px; padding: 14px 40px 14px 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,.06); margin-bottom: 10px;
      text-align: center;
      font-weight: 800; font-size: 1.15rem; color: #1e293b;
      font-family: 'Noto Sans Lao', 'Segoe UI', sans-serif;
      cursor: pointer; position: relative;
      -webkit-tap-highlight-color: transparent;
    }
    .bs-question::after {
      content: '🔊'; position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%); font-size: 1.1rem; opacity: 0.7;
      transition: transform 0.15s;
    }
    .bs-question:active::after { transform: translateY(-50%) scale(1.25); }
    .bs-question .em { font-size: 1.4rem; margin-right: 6px; }

    /* Display area — 2 emojis with custom layout per concept */
    .bs-stage {
      background: linear-gradient(180deg, #fef3c7, #fde68a);
      border-radius: 18px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,.06);
      padding: 16px; margin-bottom: 10px;
      position: relative;
      min-height: 280px;
      display: flex; gap: 8px;
      align-items: center; justify-content: center;
    }
    .bs-stage.layout-h { flex-direction: row; }
    .bs-stage.layout-v { flex-direction: column; }

    .bs-obj {
      cursor: pointer; transition: transform .15s;
      display: flex; align-items: center; justify-content: center;
      line-height: 1; padding: 8px;
      background: rgba(255,255,255,.5); border-radius: 16px;
      border: 3px solid transparent;
      box-shadow: 0 4px 0 rgba(0,0,0,.1);
    }
    .bs-obj:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.1); }
    .bs-obj.correct { background: rgba(16,185,129,.25); border-color: #10b981; animation: pop .4s; }
    .bs-obj.wrong { background: rgba(239,68,68,.25); border-color: #ef4444; animation: shake .3s; }
    .bs-obj.dim { opacity: .35; }
    @keyframes pop {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* Flash */
    .bs-flash {
      position: fixed; left: 50%; top: 35%; transform: translate(-50%, -50%) scale(.5);
      padding: 16px 28px; border-radius: 14px;
      background: linear-gradient(135deg, #a855f7, #7e22ce);
      color: #fff; font-size: 1.6rem; font-weight: 900;
      opacity: 0; pointer-events: none; z-index: 30;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }
    .bs-flash.show { animation: flashPop 1s ease-out; }
    @keyframes flashPop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
      30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      80%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }

    /* Modal */
    .bs-modal {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(15,23,42,0.7); backdrop-filter: blur(4px); z-index: 20;
    }
    .bs-modal.show { display: flex; }
    .bs-modal-card {
      background: #fff; border-radius: 18px; padding: 24px 28px;
      max-width: 92%; min-width: 280px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .bs-modal-card h2 { margin: 0 0 8px; color: #7e22ce; font-size: 1.5rem; }
    .bs-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .bs-stats-grid .cell { background: #fae8ff; padding: 10px; border-radius: 10px; }
    .bs-stats-grid .lbl { font-size: 10px; color: #7e22ce; text-transform: uppercase; font-weight: 700; }
    .bs-stats-grid .val { font-size: 1.4rem; font-weight: 900; color: #1e293b; }
    .new-best {
      display: inline-block; background: #fde68a; color: #92400e;
      font-weight: 900; font-size: .8rem; padding: 3px 12px;
      border-radius: 99px; margin-bottom: 8px; box-shadow: 0 0 12px rgba(251,191,36,.5);
    }
    .bs-btn {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #a855f7, #7e22ce);
      color: #fff; font-size: 1rem; font-weight: 800; letter-spacing: .5px;
      cursor: pointer; box-shadow: 0 4px 12px rgba(168,85,247,.35);
    }
    .bs-btn:active { transform: translateY(2px); box-shadow: 0 2px 6px rgba(168,85,247,.35); }

    @media (max-width: 380px) {
      .bs-stat .val { font-size: 15px; }
      .bs-question { font-size: 1rem; }
      .bs-stage { min-height: 240px; }
    }
  </style>
</head>
<body>
  <div class="bs-wrap">
    <div class="bs-header">
      <div class="bs-title" id="hdr-title">↕️ เปรียบเทียบ</div>
      <a href="index.html" id="hdr-back">← หน้าหลัก</a>
    </div>

    <div class="bs-hud">
      <div class="bs-stat"><div class="lbl" id="lbl-level">เลเวล</div><div class="val level" id="ui-level">1</div></div>
      <div class="bs-stat"><div class="lbl" id="lbl-score">คะแนน</div><div class="val score" id="ui-score">0</div></div>
      <div class="bs-stat"><div class="lbl" id="lbl-lives">หัวใจ</div><div class="val lives" id="ui-lives">❤❤❤❤❤</div></div>
      <div class="bs-stat"><div class="lbl" id="lbl-best">ดีที่สุด</div><div class="val best" id="ui-best">0</div></div>
    </div>

    <div class="bs-question" id="question"></div>

    <div class="bs-stage" id="stage"></div>
  </div>

  <div class="bs-flash" id="flash">เลเวล 2!</div>

  <div class="bs-modal" id="modal-over">
    <div class="bs-modal-card">
      <div class="new-best" id="newbest" style="display:none">⭐ NEW BEST!</div>
      <h2 id="over-title">จบเกม</h2>
      <div class="bs-stats-grid">
        <div class="cell">
          <div class="lbl" id="over-lbl-score">คะแนน</div>
          <div class="val" id="over-score">0</div>
        </div>
        <div class="cell">
          <div class="lbl" id="over-lbl-level">เลเวล</div>
          <div class="val" id="over-level">1</div>
        </div>
      </div>
      <button class="bs-btn" id="btn-again">▶ เล่นใหม่</button>
    </div>
  </div>

  <script src="js/tts.js"></script>
  <script src="js/big-small-game.js"></script>
</body>
</html>

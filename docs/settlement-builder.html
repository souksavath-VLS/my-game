<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Settlement Builder</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&family=Nunito:wght@500;600;700;800;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-dark:#54300f;
    --wood:#8a5a2e;
    --wood-light:#c98f52;
    --parchment:#fbf0d9;
    --parchment2:#f2dfae;
    --ink:#3b2412;
    --gold:#f2cf7e;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; overscroll-behavior: none; position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,255,255,.10), transparent 55%),
      repeating-linear-gradient(180deg, rgba(0,0,0,.07) 0 2px, transparent 2px 44px),
      linear-gradient(180deg,#8a5a30 0%, #6b3f1d 55%, #4d2c12 100%);
    font-family: 'Baloo 2', 'Nunito', 'Noto Sans Lao', system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    color: var(--ink);
  }
  * { box-sizing: border-box; }

  #app {
    position: absolute; left: 8px; right: 8px; bottom: 8px; top: max(8px, env(safe-area-inset-top));
    display: flex; flex-direction: column; overflow: hidden;
    border-radius: 26px;
    border: 4px solid var(--wood-dark);
    background:
      radial-gradient(circle at 18% 0%, rgba(255,255,255,.5), transparent 42%),
      radial-gradient(circle at 92% 100%, rgba(0,0,0,.05), transparent 50%),
      linear-gradient(160deg, var(--parchment) 0%, var(--parchment2) 100%);
    box-shadow: 0 16px 36px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.35);
  }

  /* ---- header plaque ---- */
  #topbar {
    background: linear-gradient(180deg, var(--wood-light), var(--wood) 55%, var(--wood-dark));
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.15), 0 2px 6px rgba(0,0,0,.25);
  }
  .medal {
    background: radial-gradient(circle at 34% 28%, #fff7dd, var(--parchment2) 75%);
    border: 2px solid var(--wood-dark); color: var(--ink);
    box-shadow: 0 2px 0 rgba(0,0,0,.22), 0 3px 7px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .iconbtn {
    background: linear-gradient(180deg, var(--parchment), var(--parchment2));
    border: 2px solid var(--wood-dark); color: var(--ink);
    box-shadow: 0 3px 0 rgba(0,0,0,.28), 0 4px 8px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .iconbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.28); }

  /* ---- resource rail ---- */
  #resRail {
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 18px),
      linear-gradient(180deg, var(--wood-light), var(--wood));
    box-shadow: inset 0 2px 4px rgba(0,0,0,.18);
  }
  .token {
    background: radial-gradient(circle at 32% 26%, #fff8e2, var(--parchment2) 74%);
    border: 2.5px solid var(--wood-dark); color: var(--ink);
    box-shadow: 0 3px 0 rgba(0,0,0,.24), 0 4px 9px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.65);
  }

  .btn { transition: transform .08s ease, background .15s, box-shadow .15s, opacity .15s; }
  .btn:active { transform: scale(.93); }
  .btn:disabled, .btn.disabled { opacity: .4; pointer-events: none; }

  #content { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* ---- tabs: wooden pegs ---- */
  .tabbtn {
    background: linear-gradient(180deg, #fffaf0, var(--parchment2));
    border: 2.5px solid var(--wood-dark); color: var(--ink);
    box-shadow: 0 4px 0 rgba(84,48,15,.55), 0 6px 10px rgba(0,0,0,.15);
    transition: transform .08s, box-shadow .08s, background .15s, color .15s;
  }
  .tabbtn.active {
    background: linear-gradient(180deg, var(--wood), var(--wood-dark)) !important;
    color: #fff6df !important;
    box-shadow: inset 0 3px 7px rgba(0,0,0,.45), 0 1px 0 rgba(0,0,0,.2) !important;
    transform: translateY(2px);
  }

  /* ---- tiles: job / building cards ---- */
  .jobcard, .bldcard {
    background: linear-gradient(160deg, #fffaf0, var(--parchment2));
    border: 3px solid var(--wood-dark); border-radius: 18px;
    box-shadow: 0 4px 0 rgba(84,48,15,.35), 0 6px 14px rgba(59,36,18,.18);
  }
  .stepbtn {
    width: 38px; height: 38px; border-radius: 12px; font-weight: 900; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--wood-light), var(--wood)); color: #fff6df;
    border: 2px solid var(--wood-dark);
    box-shadow: 0 3px 0 rgba(0,0,0,.32), 0 4px 8px rgba(0,0,0,.2);
  }
  .stepbtn:active { transform: translateY(2px) scale(.96); box-shadow: 0 1px 0 rgba(0,0,0,.32); }
  .stepbtn:disabled { filter: grayscale(.5); opacity: .5; box-shadow: none; transform:none; }

  /* ---- chunky 3D wood CTA buttons ---- */
  .woodbtn {
    background: linear-gradient(180deg, #b97a3f, #7c4a22);
    border: 2px solid var(--wood-dark); color: #fff6df;
    box-shadow: 0 5px 0 #40230d, 0 9px 18px rgba(0,0,0,.32);
  }
  .woodbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #40230d, 0 3px 8px rgba(0,0,0,.25); }
  .woodbtn.disabled, .woodbtn:disabled { filter: grayscale(.45); opacity: .55; box-shadow: none; }
  .woodbtn-sm {
    background: linear-gradient(180deg, #b97a3f, #7c4a22); color: #fff6df;
    border: 2px solid var(--wood-dark); box-shadow: 0 3px 0 #40230d, 0 5px 10px rgba(0,0,0,.28);
  }
  .woodbtn-sm:active { transform: translateY(2px); box-shadow: 0 1px 0 #40230d; }

  @keyframes floatUp { 0%{ transform:translateY(0); opacity:1 } 100%{ transform:translateY(-34px); opacity:0 } }
  .float-pop { position:fixed; z-index:80; font-weight:900; font-size:13px; pointer-events:none;
               animation: floatUp 1.1s ease-out forwards; }

  #toast { position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
           background:#2a1a0d; color:#fff6df; padding:10px 16px; border-radius:14px; font-weight:700;
           font-size:13px; text-align:center; max-width:92vw; opacity:0; pointer-events:none;
           transition: opacity .25s, transform .25s; z-index:70; box-shadow:0 8px 24px rgba(0,0,0,.35);
           border: 2px solid var(--wood-light); }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  #eventBanner { transition: max-height .25s ease, opacity .25s ease, padding .25s ease; overflow:hidden; }

  .modal { position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center;
           padding:20px; background:rgba(30,16,6,.55); backdrop-filter:blur(4px); }
  @keyframes rise { from{transform:translateY(18px);opacity:0} to{transform:translateY(0);opacity:1} }
  .card {
    animation: rise .28s ease;
    background: linear-gradient(160deg, #fffaf0, var(--parchment2));
    border: 4px solid var(--wood-dark);
    box-shadow: 0 18px 44px rgba(0,0,0,.45), inset 0 0 0 3px rgba(242,207,126,.55);
  }
  .ribbon {
    background: linear-gradient(180deg, var(--wood-light), var(--wood-dark));
    color: var(--gold); border: 2px solid var(--wood-dark);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.15), inset 0 -2px 0 rgba(0,0,0,.25);
  }
  .scorecard {
    background: repeating-linear-gradient(180deg, rgba(84,48,15,.05) 0 28px, rgba(84,48,15,.09) 28px 29px);
    border: 2px dashed var(--wood);
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: rgba(84,48,15,.3); border-radius: 3px; }
</style>
</head>
<body>
<div id="app">

  <!-- Top bar -->
  <div id="topbar" class="px-3 pt-3 pb-2.5 flex items-center gap-2" style="padding-top:max(0.6rem,env(safe-area-inset-top))">
    <a href="index.html" class="iconbtn btn w-10 h-10 rounded-full flex items-center justify-center text-lg shrink-0">✕</a>
    <div class="medal px-3 h-9 rounded-full flex items-center gap-1.5 font-extrabold text-sm shrink-0">
      <span>🕰️</span><span id="lblTurn">Turn</span>
      <span id="statTurn">1</span><span class="opacity-60">/20</span>
    </div>
    <div class="medal px-3 h-9 rounded-full flex items-center gap-1 font-extrabold text-sm shrink-0 ml-auto">
      <span>👥</span><span id="statPop" class="tabular-nums">5</span>
    </div>
    <button id="btnSound" class="iconbtn btn w-10 h-10 rounded-full flex items-center justify-center text-lg shrink-0">🔊</button>
  </div>

  <!-- Resource bar -->
  <div id="resRail" class="px-3 py-2 grid grid-cols-4 gap-1.5">
    <div class="token py-1.5 rounded-full flex items-center justify-center gap-1 font-extrabold text-sm"><span>🪵</span><span id="resWood" class="tabular-nums">6</span></div>
    <div class="token py-1.5 rounded-full flex items-center justify-center gap-1 font-extrabold text-sm"><span>🪨</span><span id="resStone" class="tabular-nums">4</span></div>
    <div class="token py-1.5 rounded-full flex items-center justify-center gap-1 font-extrabold text-sm"><span>🌾</span><span id="resFood" class="tabular-nums">10</span></div>
    <div class="token py-1.5 rounded-full flex items-center justify-center gap-1 font-extrabold text-sm"><span>💰</span><span id="resGold" class="tabular-nums">3</span></div>
  </div>

  <!-- Event banner -->
  <div id="eventBanner" class="mx-3 mt-2 rounded-2xl px-3 py-0 max-h-0 opacity-0" style="background:linear-gradient(160deg,#fffaf0,#f7e7c0);border:2px solid var(--wood)">
    <div class="flex items-center gap-2 py-2">
      <span id="eventIcon" class="text-2xl">✨</span>
      <div class="min-w-0">
        <div id="eventTitle" class="font-extrabold text-sm truncate" style="color:var(--wood-dark)"></div>
        <div id="eventDesc" class="text-xs truncate" style="color:var(--wood)"></div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="px-3 pt-3 flex gap-2">
    <button id="tabWorkers" class="tabbtn btn flex-1 py-2 rounded-xl font-extrabold text-sm" data-tab="workers">
      👷 <span id="lblTabWorkers">Workers</span>
    </button>
    <button id="tabBuild" class="tabbtn btn flex-1 py-2 rounded-xl font-extrabold text-sm" data-tab="build">
      🏗️ <span id="lblTabBuild">Build</span>
    </button>
  </div>

  <!-- Content -->
  <div id="content" class="px-3 py-3">
    <div id="panelWorkers"></div>
    <div id="panelBuild" style="display:none"></div>
  </div>

  <!-- Bottom action -->
  <div class="px-3 pb-3" style="padding-bottom:max(0.75rem,env(safe-area-inset-bottom))">
    <button id="btnEndTurn" class="woodbtn btn w-full rounded-2xl py-3.5 font-extrabold text-base flex items-center justify-center gap-2">
      <span>⏭️</span><span id="lblEndTurn">End Turn</span>
    </button>
  </div>

</div>

<div id="toast"></div>

<!-- Start modal -->
<div id="startModal" class="modal">
  <div class="card rounded-3xl p-0 w-full max-w-xs text-center overflow-hidden">
    <div class="ribbon py-2.5 px-4">
      <div id="startTitle" class="text-lg font-extrabold">Settlement Builder</div>
    </div>
    <div class="p-6 pt-5">
      <div class="text-5xl mb-2">🏘️</div>
      <div id="startSub" class="text-sm mb-4" style="color:var(--wood)">Build your village in 20 turns</div>
      <div id="startBest" class="text-xs font-bold mb-4" style="color:var(--wood-dark)"></div>
      <button id="btnStart" class="woodbtn btn w-full rounded-2xl py-3 font-extrabold"><span id="lblStart">Start</span></button>
    </div>
  </div>
</div>

<!-- End game modal -->
<div id="endModal" class="modal" style="display:none">
  <div class="card rounded-3xl p-0 w-full max-w-sm text-center overflow-hidden">
    <div class="ribbon py-2.5 px-4">
      <div id="endTitle" class="text-lg font-extrabold">Village Complete!</div>
    </div>
    <div class="p-6 pt-5">
      <div class="text-5xl mb-1">🏆</div>
      <div id="endRank" class="text-sm font-extrabold mb-4" style="color:var(--wood)">—</div>
      <div class="scorecard rounded-2xl p-3 mb-4 text-left text-sm" id="vpBreakdown"></div>
      <div class="flex items-center justify-center gap-2 mb-5">
        <span class="text-sm font-bold" id="lblTotalVP" style="color:var(--wood)">Total VP</span>
        <span id="endTotalVP" class="text-3xl font-extrabold tabular-nums" style="color:var(--wood-dark)">0</span>
      </div>
      <button id="btnRestart" class="woodbtn btn w-full rounded-2xl py-3 font-extrabold"><span id="lblRestart">Restart</span></button>
    </div>
  </div>
</div>

      luckyLogging:{ t:'ໂຊກດີຕັດໄມ້', d:'ຜົນຜະລິດໄມ້ +60% ໃນຮອບນີ້' },
      goldRush:{ t:'ຕື່ນຄຳ', d:'ຜົນຜະລິດຄຳເພີ່ມເປັນສອງເທົ່າໃນຮອບນີ້' },
      trader:{ t:'ພໍ່ຄ້າເລ່', d:'ແລກຫີນເປັນຄຳໃນລາຄາພິເສດໃຫ້ແລ້ວ!' },
      plague:{ t:'ພະຍາດລະບາດ', d:'ພະຍາດລະບາດເຮັດໃຫ້ປະຊາກອນຫຼຸດລົງ' },
    },
    endTitle:'ບ້ານຂອງເຈົ້າສຳເລັດແລ້ວ!', vpBuildings:'ສິ່ງກໍ່ສ້າງ', vpPopulation:'ປະຊາກອນ', vpResources:'ຊັບພະຍາກອນເຫຼືອ',
    vpPenalty:'ບົດລົງໂທດຂາດອາຫານ', totalVP:'ຄະແນນລວມ', restart:'ເລີ່ມໃໝ່',
    rank:{ bronze:'🥉 ບ້ານນ້ອຍ', silver:'🥈 ເມືອງທີ່ກຳລັງເຕີບໂຕ', gold:'🥇 ນະຄອນທີ່ຮຸ່ງເຮືອງ', legend:'👑 ອານາຈັກໃນຕຳນານ' },
    toastStarve:'⚠️ ອາຫານບໍ່ພໍ! ປະຊາກອນຫຼຸດລົງ',
  },
};
let lang = localStorage.getItem('lang') || 'en';
if (!I18N[lang]) lang = 'en';
const T = () => I18N[lang];

/* ============================ Audio ============================ */
let muted = localStorage.getItem('settlementMuted') === '1';
let actx = null;
function ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); return actx; }
function tone(f,d,type='sine',g=0.16,slide=null){
  if(muted) return;
  try{ const c=ac(),o=c.createOscillator(),ga=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,c.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+d);
    ga.gain.setValueAtTime(0.0001,c.currentTime);
    ga.gain.exponentialRampToValueAtTime(g,c.currentTime+0.008);
    ga.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d);
    o.connect(ga); ga.connect(c.destination); o.start(); o.stop(c.currentTime+d+0.02);
  }catch(e){}
}
const sTap    = ()=>tone(440,0.045,'triangle',0.12);
const sBuild  = ()=>{ tone(600,0.09,'sine',0.2,880); setTimeout(()=>tone(880,0.11,'sine',0.16),80); };
const sError  = ()=>tone(200,0.16,'sawtooth',0.16,120);
const sTurn   = ()=>{ tone(392,0.07,'triangle',0.14); setTimeout(()=>tone(523,0.10,'triangle',0.14),70); };
const sEvent  = ()=>{ tone(660,0.10,'sine',0.16,930); };
function sWin(){ if(muted)return; [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'triangle',0.2),i*130)); }

/* ============================ Config ============================ */
const MAX_TURNS = 20;
const JOBS = [
  { key:'forest', icon:'🌲', res:'wood',  base:3 },
  { key:'mine',   icon:'⛰️', res:'stone', base:2 },
  { key:'farm',   icon:'🌾', res:'food',  base:4 },
  { key:'market', icon:'🏪', res:'gold',  base:2 },
];
const RES_ICON = { wood:'🪵', stone:'🪨', food:'🌾', gold:'💰' };
const BUILDINGS = [
  { key:'house',        icon:'🏠', repeatable:true,  baseCost:{wood:6,stone:3},  scale:1.35 },
  { key:'sawmill',       icon:'🪚', repeatable:false, cost:{wood:10,stone:5} },
  { key:'quarry',        icon:'⚒️', repeatable:false, cost:{wood:8,stone:6} },
  { key:'granary',       icon:'🍞', repeatable:false, cost:{wood:8,gold:5} },
  { key:'market_stall',  icon:'🛒', repeatable:false, cost:{wood:6,stone:5} },
  { key:'wall',          icon:'🧱', repeatable:true,  baseCost:{stone:12,gold:6}, scale:1.35 },
];
const EVENTS = [
  { id:'drought',      mult:{res:'food',  value:0.5} },
  { id:'forestFire',   mult:{res:'wood',  value:0.5} },
  { id:'rockslide',    mult:{res:'stone', value:0.5} },
  { id:'bountiful',    mult:{res:'food',  value:1.6} },
  { id:'luckyLogging', mult:{res:'wood',  value:1.6} },
  { id:'goldRush',     mult:{res:'gold',  value:2.0} },
  { id:'trader', instant:(st)=>{ const conv=Math.min(st.resources.stone,4); st.resources.stone-=conv; st.resources.gold+=conv; return conv; } },
  { id:'plague', instant:(st)=>{ const before=st.population; st.population=Math.max(2, st.population-1); return before-st.population; } },
];

/* ============================ State ============================ */
let state = null;
function freshState(){
  return {
    turn: 1,
    resources: { wood:6, stone:4, food:10, gold:3 },
    population: 5,
    owned: { house:0, sawmill:false, quarry:false, granary:false, market_stall:false, wall:0 },
    assigned: { forest:0, mine:0, farm:0, market:0 },
    starvationPenalty: 0,
    currentEvent: null,
    tab: 'workers',
    over: false,
  };
}
function assignedTotal(){ return Object.values(state.assigned).reduce((a,b)=>a+b,0); }
function availableWorkers(){ return state.population - assignedTotal(); }
function prodMultiplier(resKey){
  let m = 1;
  if (resKey==='wood'  && state.owned.sawmill)      m *= 1.5;
  if (resKey==='stone' && state.owned.quarry)       m *= 1.5;
  if (resKey==='food'  && state.owned.granary)      m *= 1.5;
  if (resKey==='gold'  && state.owned.market_stall) m *= 1.5;
  if (state.currentEvent && state.currentEvent.mult && state.currentEvent.mult.res===resKey) m *= state.currentEvent.mult.value;
  return m;
}
function buildingCost(b){
  if (!b.repeatable) return b.cost;
  const n = state.owned[b.key];
  const cost = {};
  for (const k in b.baseCost) cost[k] = Math.ceil(b.baseCost[k] * Math.pow(b.scale, n));
  return cost;
}
function canAfford(cost){
  for (const k in cost) if (state.resources[k] < cost[k]) return false;
  return true;
}

/* ============================ Render ============================ */
function fmtNum(n){ return Math.floor(n); }

function renderTop(){
  document.getElementById('statTurn').textContent = state.turn;
  document.getElementById('statPop').textContent = state.population;
  document.getElementById('resWood').textContent = fmtNum(state.resources.wood);
  document.getElementById('resStone').textContent = fmtNum(state.resources.stone);
  document.getElementById('resFood').textContent = fmtNum(state.resources.food);
  document.getElementById('resGold').textContent = fmtNum(state.resources.gold);
}

function renderEventBanner(){
  const el = document.getElementById('eventBanner');
  if (!state.currentEvent) {
    el.style.maxHeight = '0px'; el.style.opacity = '0'; el.style.padding = '0';
    return;
  }
  const ev = T().events[state.currentEvent.id];
  const iconMap = { drought:'🌵', forestFire:'🔥', rockslide:'⛏️', bountiful:'🌻', luckyLogging:'🪓', goldRush:'✨', trader:'🐫', plague:'🤒' };
  document.getElementById('eventIcon').textContent = iconMap[state.currentEvent.id] || '✨';
  document.getElementById('eventTitle').textContent = ev.t;
  document.getElementById('eventDesc').textContent = ev.d;
  el.style.maxHeight = '80px'; el.style.opacity = '1'; el.style.padding = '';
}

function renderWorkers(){
  const t = T();
  const avail = availableWorkers();
  let html = `<div class="flex items-center justify-between mb-3 px-1">
    <span class="font-extrabold text-sm" style="color:var(--wood-dark)">${t.available}</span>
    <span class="font-extrabold text-lg text-emerald-700 tabular-nums">${avail}</span>
  </div>
  <div class="grid grid-cols-1 gap-2.5">`;
  for (const job of JOBS) {
    const n = state.assigned[job.key];
    const mult = prodMultiplier(job.res);
    const perWorker = job.base * mult;
    const total = Math.floor(n * perWorker);
    const multTag = mult !== 1 ? `<span class="text-xs font-extrabold ${mult>1?'text-emerald-600':'text-rose-500'}">x${mult.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')}</span>` : '';
    html += `<div class="jobcard p-3 flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center text-2xl shrink-0" style="background:var(--parchment)">${job.icon}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5">
          <span class="font-extrabold text-sm" style="color:var(--ink)">${t.jobs[job.key]}</span>
          ${multTag}
        </div>
        <div class="text-xs font-semibold" style="color:var(--wood)">${RES_ICON[job.res]} ${perWorker.toFixed(1)} ${t.perWorker} · <span class="font-extrabold" style="color:var(--wood-dark)">+${total}</span> ${t.totalOut}</div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button class="stepbtn btn" data-act="dec" data-job="${job.key}" ${n<=0?'disabled':''}>−</button>
        <span class="w-6 text-center font-extrabold text-lg tabular-nums">${n}</span>
        <button class="stepbtn btn" data-act="inc" data-job="${job.key}" ${avail<=0?'disabled':''}>+</button>
      </div>
    </div>`;
  }
  html += `</div>`;
  document.getElementById('panelWorkers').innerHTML = html;
  document.querySelectorAll('#panelWorkers .stepbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const job = btn.dataset.job, act = btn.dataset.act;
      if (act==='inc') { if (availableWorkers()>0) { state.assigned[job]++; sTap(); renderWorkers(); } }
      else { if (state.assigned[job]>0) { state.assigned[job]--; sTap(); renderWorkers(); } }
    });
  });
}

function renderBuild(){
  const t = T();
  let html = `<div class="grid grid-cols-1 gap-2.5">`;
  for (const b of BUILDINGS) {
    const cost = buildingCost(b);
    const afford = canAfford(cost);
    const owned = b.repeatable ? state.owned[b.key] : state.owned[b.key];
    const costStr = Object.keys(cost).map(k=>`<span class="${state.resources[k]<cost[k]?'text-rose-500':''}" style="${state.resources[k]<cost[k]?'':'color:var(--wood)'}">${RES_ICON[k]}${cost[k]}</span>`).join(' ');
    const ownedTag = b.repeatable
      ? `<span class="text-xs font-extrabold" style="color:var(--wood-dark)">${t.owned}: ${owned}</span>`
      : (owned ? `<span class="text-xs font-extrabold text-emerald-600">${t.built}</span>` : '');
    const disabled = (!b.repeatable && owned) || !afford;
    html += `<div class="bldcard p-3 flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center text-2xl shrink-0" style="background:var(--parchment)">${b.icon}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5 flex-wrap">
          <span class="font-extrabold text-sm" style="color:var(--ink)">${t.buildings[b.key]}</span>
          ${ownedTag}
        </div>
        <div class="text-xs font-semibold" style="color:var(--wood)">${t.bldEffect[b.key]}</div>
        <div class="text-xs font-bold mt-0.5">${t.cost}: ${costStr}</div>
      </div>
      <button class="btn shrink-0 rounded-xl px-3 py-2 font-extrabold text-xs ${disabled?'disabled':'woodbtn-sm'}"
              style="${(!b.repeatable && owned) ? 'background:#a3a3a3;color:#fff' : ''}"
              data-bld="${b.key}" ${disabled?'disabled':''}>${(!b.repeatable && owned) ? t.built : t.build}</button>
    </div>`;
  }
  html += `</div>`;
  document.getElementById('panelBuild').innerHTML = html;
  document.querySelectorAll('#panelBuild [data-bld]').forEach(btn=>{
    btn.addEventListener('click', ()=>buyBuilding(btn.dataset.bld));
  });
}

function renderAll(){
  renderTop();
  renderEventBanner();
  renderWorkers();
  renderBuild();
}

/* ============================ Tabs ============================ */
function setTab(tab){
  state.tab = tab;
  document.getElementById('panelWorkers').style.display = tab==='workers' ? '' : 'none';
  document.getElementById('panelBuild').style.display = tab==='build' ? '' : 'none';
  document.getElementById('tabWorkers').classList.toggle('active', tab==='workers');
  document.getElementById('tabBuild').classList.toggle('active', tab==='build');
}
document.getElementById('tabWorkers').addEventListener('click', ()=>{ sTap(); setTab('workers'); });
document.getElementById('tabBuild').addEventListener('click', ()=>{ sTap(); setTab('build'); });

/* ============================ Buildings ============================ */
function buyBuilding(key){
  const b = BUILDINGS.find(x=>x.key===key);
  if (!b.repeatable && state.owned[key]) return;
  const cost = buildingCost(b);
  if (!canAfford(cost)) { sError(); return; }
  for (const k in cost) state.resources[k] -= cost[k];
  if (b.repeatable) state.owned[key]++;
  else state.owned[key] = true;
  if (key==='house') state.population += 2;
  sBuild();
  renderAll();
}

/* ============================ Toast ============================ */
let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

/* ============================ Events ============================ */
function rollEvent(){
  if (state.turn === 1) return null;
  const weighted = [];
  for (let i=0;i<9;i++) weighted.push(null);   // "calm" weight
  for (const ev of EVENTS) weighted.push(ev);  // weight 1 each
  const pick = weighted[Math.floor(Math.random()*weighted.length)];
  if (!pick) return null;
  if (pick.instant) pick.instant(state);
  return pick;
}

/* ============================ End Turn ============================ */
function endTurn(){
  const t = T();
  const gains = {};
  for (const job of JOBS) {
    const mult = prodMultiplier(job.res);
    const amt = Math.floor(state.assigned[job.key] * job.base * mult);
    gains[job.res] = (gains[job.res]||0) + amt;
    state.resources[job.res] += amt;
  }
  // food consumption
  const consumption = state.population;
  let starved = false, popLoss = 0;
  if (state.resources.food >= consumption) {
    state.resources.food -= consumption;
  } else {
    const deficit = consumption - state.resources.food;
    state.resources.food = 0;
    popLoss = Math.max(1, Math.ceil(deficit/3));
    state.population = Math.max(2, state.population - popLoss);
    state.starvationPenalty++;
    starved = true;
  }

  let msg = `${t.turn} ${state.turn}: ` + JOBS.map(j=>`+${gains[j.res]||0}${RES_ICON[j.res]}`).join(' ') + ` · 🍽️-${consumption}`;
  if (starved) msg += `  |  ${t.toastStarve} -${popLoss}👥`;
  showToast(msg);
  sTurn();

  // reset for next turn
  state.assigned = { forest:0, mine:0, farm:0, market:0 };
  state.turn++;

  if (state.turn > MAX_TURNS) { endGame(); return; }

  state.currentEvent = rollEvent();
  if (state.currentEvent) sEvent();
  renderAll();
}
document.getElementById('btnEndTurn').addEventListener('click', endTurn);

/* ============================ Game Over ============================ */
function computeVP(){
  const buildingVP = state.owned.house*2 + state.owned.wall*6
    + (state.owned.sawmill?4:0) + (state.owned.quarry?4:0)
    + (state.owned.granary?4:0) + (state.owned.market_stall?4:0);
  const popVP = state.population*2;
  const resVP = Math.floor((state.resources.wood+state.resources.stone+state.resources.gold)/3) + Math.floor(state.resources.food/2);
  const penalty = state.starvationPenalty*4;
  const total = Math.max(0, buildingVP + popVP + resVP - penalty);
  return { buildingVP, popVP, resVP, penalty, total };
}
function endGame(){
  state.over = true;
  const t = T();
  const vp = computeVP();
  sWin();
  document.getElementById('endTitle').textContent = t.endTitle;
  let rankKey = 'bronze';
  if (vp.total>=90) rankKey='legend'; else if (vp.total>=60) rankKey='gold'; else if (vp.total>=30) rankKey='silver';
  document.getElementById('endRank').textContent = t.rank[rankKey];
  document.getElementById('vpBreakdown').innerHTML = `
    <div class="flex justify-between py-0.5 px-1"><span>🏗️ ${t.vpBuildings}</span><span class="font-extrabold">+${vp.buildingVP}</span></div>
    <div class="flex justify-between py-0.5 px-1"><span>👥 ${t.vpPopulation}</span><span class="font-extrabold">+${vp.popVP}</span></div>
    <div class="flex justify-between py-0.5 px-1"><span>📦 ${t.vpResources}</span><span class="font-extrabold">+${vp.resVP}</span></div>
    ${vp.penalty>0?`<div class="flex justify-between py-0.5 px-1 text-rose-600"><span>🍽️ ${t.vpPenalty}</span><span class="font-extrabold">-${vp.penalty}</span></div>`:''}
  `;
  document.getElementById('endTotalVP').textContent = vp.total;

  const best = parseInt(localStorage.getItem('settlementBestVP')||'0',10);
  if (vp.total > best) localStorage.setItem('settlementBestVP', String(vp.total));

  document.getElementById('endModal').style.display = 'flex';
}
document.getElementById('btnRestart').addEventListener('click', ()=>{
  document.getElementById('endModal').style.display = 'none';
  document.getElementById('startModal').style.display = 'flex';
  updateStartBest();
});

/* ============================ Start ============================ */
function updateStartBest(){
  const best = parseInt(localStorage.getItem('settlementBestVP')||'0',10);
  const el = document.getElementById('startBest');
  el.textContent = best>0 ? `🏆 ${T().best}: ${best} VP` : '';
}
document.getElementById('btnStart').addEventListener('click', ()=>{
  ac();
  state = freshState();
  document.getElementById('startModal').style.display = 'none';
  setTab('workers');
  renderAll();
});

/* ============================ Sound toggle ============================ */
document.getElementById('btnSound').addEventListener('click', ()=>{
  muted = !muted; localStorage.setItem('settlementMuted', muted?'1':'0');
  document.getElementById('btnSound').textContent = muted?'🔇':'🔊';
  if (!muted) tone(660,0.08,'sine',0.16);
});

/* ============================ i18n apply ============================ */
function applyLang(){
  const t = T();
  document.getElementById('startTitle').textContent = t.title;
  document.getElementById('startSub').textContent = t.sub;
  document.getElementById('lblStart').textContent = t.start;
  document.getElementById('lblTurn').textContent = t.turn;
  document.getElementById('lblTabWorkers').textContent = t.tabWorkers;
  document.getElementById('lblTabBuild').textContent = t.tabBuild;
  document.getElementById('lblEndTurn').textContent = t.endTurn;
  document.getElementById('lblTotalVP').textContent = t.totalVP;
  document.getElementById('lblRestart').textContent = t.restart;
  document.documentElement.lang = lang === 'lao' ? 'lo' : lang;
}

/* ============================ Boot ============================ */
applyLang();
document.getElementById('btnSound').textContent = muted ? '🔇' : '🔊';
updateStartBest();
document.getElementById('startModal').style.display = 'flex';
</script>

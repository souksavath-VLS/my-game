<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เดือนในปี · Months</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: linear-gradient(180deg, #ddd6fe, #fce7f3);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }
    .mg-wrap { max-width: 480px; margin: 0 auto; padding: 8px; }

    .mg-header {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      color: #fff; padding: 14px 16px; border-radius: 14px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 12px rgba(124,58,237,0.3); margin-bottom: 10px;
    }
    .mg-title { font-size: 1.15rem; font-weight: 800; letter-spacing: .5px; }
    .mg-header a { color: #fff; text-decoration: none; background: rgba(255,255,255,.22);
                   padding: 6px 12px; border-radius: 20px; font-size: .85rem; }

    /* Mode tabs */
    .mg-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
    .mg-tab {
      flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #cbd5e1;
      background: #fff; cursor: pointer; font-weight: 700; font-size: .95rem; color: #475569;
    }
    .mg-tab.active { background: #7c3aed; color: #fff; border-color: #7c3aed; box-shadow: 0 2px 8px rgba(124,58,237,.3); }

    /* HUD */
    .mg-hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
    .mg-stat { background: #fff; border-radius: 10px; padding: 8px 4px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .mg-stat .lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .mg-stat .val { font-size: 18px; font-weight: 900; color: #1e293b; line-height: 1.1; }
    .mg-stat .val.time { color: #2563eb; }
    .mg-stat .val.miss { color: #ef4444; }
    .mg-stat .val.best { color: #b45309; }

    /* Timeline of progress */
    .mg-timeline {
      display: flex; gap: 4px; padding: 8px;
      background: #fff; border-radius: 10px; margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }
    .mg-step {
      flex: 1; height: 12px; background: #e2e8f0; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; font-weight: 700; color: #cbd5e1;
      transition: all .3s;
    }
    .mg-step.done { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
    .mg-step.current { background: #fde68a; color: #92400e; }

    /* Month grid */
    .mg-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-bottom: 10px;
    }
    .mg-cell {
      background: #fff; border-radius: 12px;
      padding: 10px 6px;
      box-shadow: 0 2px 4px rgba(0,0,0,.08);
      border: 2px solid transparent;
      cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      transition: all .2s; position: relative;
      min-height: 90px;
    }
    .mg-cell:active { transform: scale(.96); }
    .mg-cell .emoji { font-size: 1.8rem; line-height: 1; margin-bottom: 2px; }
    .mg-cell .name {
      font-weight: 800; font-size: .9rem; color: #1e293b;
      font-family: 'Noto Sans Lao', 'Segoe UI', sans-serif;
      text-align: center; line-height: 1.15;
    }
    .mg-cell .num {
      position: absolute; top: 4px; left: 6px;
      font-size: 10px; font-weight: 800; color: #94a3b8;
    }
    /* Quiz mode hides the number hint — that would give away the answer */
    .mg-grid.quiz .mg-cell .num { display: none; }
    .mg-cell.done {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      border-color: #10b981;
    }
    .mg-cell.current-hint { border-color: #fbbf24; box-shadow: 0 0 12px rgba(251,191,36,.4); }
    .mg-cell.correct { animation: correctPop .5s; background: #10b981; color: #fff; }
    .mg-cell.correct .name, .mg-cell.correct .num { color: #fff; }
    .mg-cell.wrong { animation: wrongShake .4s; }
    @keyframes correctPop {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    @keyframes wrongShake {
      0%,100% { transform: translateX(0); background-color: #fee2e2; }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* Info card (Learn mode tap) */
    .mg-info {
      background: #fff; border-radius: 12px; padding: 10px 14px;
      box-shadow: 0 2px 4px rgba(0,0,0,.05);
      display: none; margin-bottom: 10px;
      align-items: center; gap: 10px;
    }
    .mg-info.show { display: flex; }
    .mg-info .em { font-size: 2.4rem; }
    .mg-info .text { flex: 1; }
    .mg-info .nm { font-weight: 800; font-size: 1.1rem; color: #1e293b;
                   font-family: 'Noto Sans Lao', 'Segoe UI', sans-serif; }
    .mg-info .sb { font-size: .8rem; color: #64748b; }
    .mg-info .nb { font-weight: 800; color: #7c3aed; font-size: 1.4rem; min-width: 32px; text-align: center; }

    /* Modal */
    .mg-modal {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(15,23,42,0.7); backdrop-filter: blur(4px);
      z-index: 20;
    }
    .mg-modal.show { display: flex; }
    .mg-modal-card {
      background: #fff; border-radius: 18px; padding: 24px 28px;
      max-width: 92%; min-width: 280px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .mg-modal-card h2 { margin: 0 0 8px; color: #7c3aed; font-size: 1.5rem; }
    .mg-stars { font-size: 2.6rem; margin: 10px 0; letter-spacing: 4px; }
    .mg-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .mg-stats-grid .cell { background: #f1f5f9; padding: 10px; border-radius: 10px; }
    .mg-stats-grid .lbl { font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: 700; }
    .mg-stats-grid .val { font-size: 1.4rem; font-weight: 900; color: #1e293b; }
    .new-best {
      display: inline-block; background: #fde68a; color: #92400e;
      font-weight: 900; font-size: .8rem; padding: 3px 12px;
      border-radius: 99px; margin-bottom: 8px; box-shadow: 0 0 12px rgba(251,191,36,.5);
    }
    .mg-btn {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      color: #fff; font-size: 1rem; font-weight: 800; letter-spacing: .5px;
      cursor: pointer; box-shadow: 0 4px 12px rgba(124,58,237,.35);
    }
    .mg-btn:active { transform: translateY(2px); box-shadow: 0 2px 6px rgba(124,58,237,.35); }
    .mg-btn.secondary { background: #fff; color: #1e293b; border: 2px solid #cbd5e1; box-shadow: none; }

    @media (max-width: 380px) {
      .mg-cell { min-height: 80px; padding: 8px 4px; }
      .mg-cell .emoji { font-size: 1.5rem; }
      .mg-cell .name { font-size: .8rem; }
    }
  </style>
</head>
<body>
  <div class="mg-wrap">
    <div class="mg-header">
      <div class="mg-title" id="hdr-title">📅 เดือนในปี</div>
      <a href="index.html" id="hdr-back">← หน้าหลัก</a>
    </div>

    <div class="mg-tabs">
      <button class="mg-tab active" data-mode="learn" id="tab-learn">📖 <span>Learn</span></button>
      <button class="mg-tab" data-mode="quiz" id="tab-quiz">🎯 <span>Quiz</span></button>
    </div>

    <div class="mg-hud">
      <div class="mg-stat"><div class="lbl" id="lbl-time">เวลา</div><div class="val time" id="ui-time">0s</div></div>
      <div class="mg-stat"><div class="lbl" id="lbl-miss">พลาด</div><div class="val miss" id="ui-miss">0</div></div>
      <div class="mg-stat"><div class="lbl" id="lbl-best">ดีที่สุด</div><div class="val best" id="ui-best">—</div></div>
    </div>

    <!-- Quiz mode: progress timeline -->
    <div class="mg-timeline" id="timeline"></div>

    <!-- Learn mode: info card -->
    <div class="mg-info" id="info">
      <div class="em" id="info-em">📅</div>
      <div class="text">
        <div class="nm" id="info-nm"></div>
        <div class="sb" id="info-sb"></div>
      </div>
      <div class="nb" id="info-nb"></div>
    </div>

    <div class="mg-grid" id="grid"></div>
  </div>

  <!-- Win modal -->
  <div class="mg-modal" id="modal-win">
    <div class="mg-modal-card">
      <div class="new-best" id="newbest" style="display:none">⭐ NEW BEST!</div>
      <h2 id="win-title">เก่งมาก!</h2>
      <div class="mg-stars" id="win-stars">⭐⭐⭐</div>
      <div class="mg-stats-grid">
        <div class="cell">
          <div class="lbl" id="win-lbl-time">เวลา</div>
          <div class="val" id="win-time">0s</div>
        </div>
        <div class="cell">
          <div class="lbl" id="win-lbl-miss">พลาด</div>
          <div class="val" id="win-miss">0</div>
        </div>
      </div>
      <button class="mg-btn" id="btn-again">▶ เล่นใหม่</button>
    </div>
  </div>

  <script src="js/tts.js"></script>
  <script src="js/months-game.js"></script>
</body>
</html>

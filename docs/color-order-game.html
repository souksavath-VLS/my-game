<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เรียงสี · Color Order</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: linear-gradient(180deg, #fef3c7, #fbcfe8);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }
    .co-wrap { max-width: 480px; margin: 0 auto; padding: 8px; }

    .co-header {
      background: linear-gradient(135deg, #06b6d4, #0e7490);
      color: #fff; padding: 14px 16px; border-radius: 14px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 12px rgba(6,182,212,0.3); margin-bottom: 10px;
    }
    .co-title { font-size: 1.15rem; font-weight: 800; letter-spacing: .5px; }
    .co-header a { color: #fff; text-decoration: none; background: rgba(255,255,255,.22);
                   padding: 6px 12px; border-radius: 20px; font-size: .85rem; }

    .co-hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .co-stat { background: #fff; border-radius: 10px; padding: 8px 4px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .co-stat .lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .co-stat .val { font-size: 18px; font-weight: 900; color: #1e293b; line-height: 1.1; }
    .co-stat .val.level { color: #06b6d4; }
    .co-stat .val.score { color: #2563eb; }
    .co-stat .val.lives { color: #ef4444; letter-spacing: 0; }
    .co-stat .val.best { color: #b45309; }

    /* Sequence display */
    .co-sequence-card {
      background: #fff; border-radius: 16px; padding: 14px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 10px;
    }
    .co-sequence-hint {
      text-align: center; font-size: .9rem; font-weight: 700; color: #475569;
      font-family: 'Noto Sans Lao', 'Segoe UI', sans-serif;
      margin-bottom: 10px;
    }
    .co-sequence {
      display: flex; gap: 6px; flex-wrap: wrap;
      justify-content: center; align-items: center;
    }
    .co-seq-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 4px 6px; border-radius: 10px;
      transition: all .2s;
    }
    .co-seq-item.current {
      background: rgba(251,191,36,.25);
      box-shadow: 0 0 0 2px #fbbf24;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .co-seq-item.done { opacity: .35; }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .co-seq-circle {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(0,0,0,.18);
      box-shadow: 0 2px 4px rgba(0,0,0,.12);
    }
    .co-seq-name {
      font-size: .72rem; font-weight: 700; color: #1e293b;
      font-family: 'Noto Sans Lao', 'Segoe UI', sans-serif;
    }
    .co-seq-arrow { color: #94a3b8; font-size: 1rem; padding: 0 2px; }

    /* Button grid */
    .co-buttons {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      margin-bottom: 10px;
    }
    .co-btn {
      aspect-ratio: 1 / 1;
      border-radius: 18px; border: 4px solid rgba(0,0,0,.15);
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,.18), inset 0 -4px 0 rgba(0,0,0,.12);
      transition: transform .15s;
      position: relative;
    }
    .co-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.18), inset 0 -4px 0 rgba(0,0,0,.12); }
    .co-btn.correct {
      animation: pop .4s;
      box-shadow: 0 6px 0 rgba(0,0,0,.18), inset 0 -4px 0 rgba(0,0,0,.12), 0 0 24px rgba(16,185,129,.6);
    }
    .co-btn.wrong { animation: shake .4s; }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* Flash */
    .co-flash {
      position: fixed; left: 50%; top: 35%; transform: translate(-50%, -50%) scale(.5);
      padding: 16px 28px; border-radius: 14px;
      background: linear-gradient(135deg, #06b6d4, #0e7490);
      color: #fff; font-size: 1.6rem; font-weight: 900;
      opacity: 0; pointer-events: none; z-index: 30;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }
    .co-flash.show { animation: flashPop 1s ease-out; }
    @keyframes flashPop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
      30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      80%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }

    /* Modal */
    .co-modal {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(15,23,42,0.7); backdrop-filter: blur(4px); z-index: 20;
    }
    .co-modal.show { display: flex; }
    .co-modal-card {
      background: #fff; border-radius: 18px; padding: 24px 28px;
      max-width: 92%; min-width: 280px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .co-modal-card h2 { margin: 0 0 8px; color: #0e7490; font-size: 1.5rem; }
    .co-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .co-stats-grid .cell { background: #cffafe; padding: 10px; border-radius: 10px; }
    .co-stats-grid .lbl { font-size: 10px; color: #0e7490; text-transform: uppercase; font-weight: 700; }
    .co-stats-grid .val { font-size: 1.4rem; font-weight: 900; color: #1e293b; }
    .new-best {
      display: inline-block; background: #fde68a; color: #92400e;
      font-weight: 900; font-size: .8rem; padding: 3px 12px;
      border-radius: 99px; margin-bottom: 8px; box-shadow: 0 0 12px rgba(251,191,36,.5);
    }
    .co-btn-modal {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #06b6d4, #0e7490);
      color: #fff; font-size: 1rem; font-weight: 800; letter-spacing: .5px;
      cursor: pointer; box-shadow: 0 4px 12px rgba(6,182,212,.35);
    }
    .co-btn-modal:active { transform: translateY(2px); box-shadow: 0 2px 6px rgba(6,182,212,.35); }

    @media (max-width: 380px) {
      .co-stat .val { font-size: 15px; }
      .co-seq-circle { width: 30px; height: 30px; }
      .co-seq-name { font-size: .65rem; }
    }
  </style>
</head>
<body>
  <div class="co-wrap">
    <div class="co-header">
      <div class="co-title" id="hdr-title">🎨 เรียงสี</div>
      <a href="index.html" id="hdr-back">← หน้าหลัก</a>
    </div>

    <div class="co-hud">
      <div class="co-stat"><div class="lbl" id="lbl-level">เลเวล</div><div class="val level" id="ui-level">1</div></div>
      <div class="co-stat"><div class="lbl" id="lbl-score">คะแนน</div><div class="val score" id="ui-score">0</div></div>
      <div class="co-stat"><div class="lbl" id="lbl-lives">หัวใจ</div><div class="val lives" id="ui-lives">❤❤❤❤❤</div></div>
      <div class="co-stat"><div class="lbl" id="lbl-best">ดีที่สุด</div><div class="val best" id="ui-best">0</div></div>
    </div>

    <div class="co-sequence-card">
      <div class="co-sequence-hint" id="hint">กดสีตามลำดับ</div>
      <div class="co-sequence" id="sequence"></div>
    </div>

    <div class="co-buttons" id="buttons"></div>
  </div>

  <div class="co-flash" id="flash">เลเวล 2!</div>

  <div class="co-modal" id="modal-over">
    <div class="co-modal-card">
      <div class="new-best" id="newbest" style="display:none">⭐ NEW BEST!</div>
      <h2 id="over-title">จบเกม</h2>
      <div class="co-stats-grid">
        <div class="cell">
          <div class="lbl" id="over-lbl-score">คะแนน</div>
          <div class="val" id="over-score">0</div>
        </div>
        <div class="cell">
          <div class="lbl" id="over-lbl-level">เลเวล</div>
          <div class="val" id="over-level">1</div>
        </div>
      </div>
      <button class="co-btn-modal" id="btn-again">▶ เล่นใหม่</button>
    </div>
  </div>

  <script src="js/tts.js"></script>
  <script src="js/color-order-game.js"></script>
</body>
</html>

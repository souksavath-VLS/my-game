<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ບວກ-ລົບ · Counting Math</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: linear-gradient(180deg, #dbeafe, #fef3c7);
      font-family: 'Noto Sans Lao', 'Segoe UI', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      color: #1e293b;
    }
    .mg-wrap { max-width: 480px; margin: 0 auto; padding: 8px; }

    .mg-header {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: #fff; padding: 14px 16px; border-radius: 14px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 12px rgba(37,99,235,0.35); margin-bottom: 10px;
    }
    .mg-title { font-size: 1.15rem; font-weight: 800; letter-spacing: .5px; }
    .mg-header a { color: #fff; text-decoration: none; background: rgba(255,255,255,.22);
                   padding: 6px 12px; border-radius: 20px; font-size: .85rem; }

    .mg-hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .mg-stat { background: #fff; border-radius: 10px; padding: 8px 4px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .mg-stat .lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .mg-stat .val { font-size: 18px; font-weight: 900; color: #1e293b; line-height: 1.1; }
    .mg-stat .val.level { color: #2563eb; }
    .mg-stat .val.score { color: #f59e0b; }
    .mg-stat .val.lives { color: #ef4444; letter-spacing: 0; }
    .mg-stat .val.best  { color: #b45309; }

    /* Equation card */
    .mg-eq {
      background: #fff; border-radius: 16px; padding: 16px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 10px;
      position: relative;
    }
    .mg-speak {
      position: absolute; top: 10px; right: 10px;
      background: #fef3c7; border: 2px solid #f59e0b;
      width: 38px; height: 38px; border-radius: 50%;
      cursor: pointer; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
    }
    .mg-speak:active { transform: scale(.9); }
    .mg-eq-row {
      display: flex; align-items: center; justify-content: center;
      flex-wrap: wrap; gap: 8px; min-height: 110px;
      font-size: 2rem; font-weight: 900; color: #1e293b;
    }
    .mg-group {
      display: grid; gap: 2px; padding: 6px 8px;
      background: #f8fafc; border-radius: 12px; border: 2px dashed #cbd5e1;
      min-width: 70px;
    }
    .mg-emoji {
      font-size: 1.3rem; line-height: 1;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.1));
    }
    .mg-op {
      font-size: 2.4rem; color: #2563eb; font-weight: 900;
      padding: 0 4px;
    }
    .mg-eq-q {
      font-size: 2.4rem; font-weight: 900; color: #c2410c;
      min-width: 50px; text-align: center;
      background: #fef3c7; border-radius: 12px; padding: 6px 14px;
      border: 3px dashed #f59e0b;
    }
    .mg-eq-num {
      font-size: 2.4rem; font-weight: 900; color: #1e293b;
    }
    .mg-eq-num.small { font-size: 1.6rem; }

    /* Numeric digit display (high level) */
    .mg-eq.compact .mg-group { display: none; }
    .mg-eq.compact .mg-eq-row { font-size: 2.6rem; }

    /* Options */
    .mg-options {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
      margin-bottom: 10px;
    }
    .mg-opt {
      aspect-ratio: 2 / 1;
      background: #fff; border: 3px solid rgba(0,0,0,.08); border-radius: 14px;
      font-size: 2rem; font-weight: 900; color: #1e293b;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 0 rgba(0,0,0,.1);
      transition: transform .12s;
    }
    .mg-opt:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.1); }
    .mg-opt.correct {
      background: #d1fae5; border-color: #10b981; color: #065f46;
      animation: pop .4s;
    }
    .mg-opt.wrong {
      background: #fee2e2; border-color: #ef4444; color: #991b1b;
      animation: shake .4s;
    }
    .mg-opt.dim { opacity: .35; }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

    /* Flash */
    .mg-flash {
      position: fixed; left: 50%; top: 35%; transform: translate(-50%, -50%) scale(.5);
      padding: 16px 28px; border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: #fff; font-size: 1.6rem; font-weight: 900;
      opacity: 0; pointer-events: none; z-index: 30;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }
    .mg-flash.show { animation: flashPop 1s ease-out; }
    @keyframes flashPop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
      30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      80%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }

    /* Modal */
    .mg-modal {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(15,23,42,0.7); backdrop-filter: blur(4px); z-index: 20;
    }
    .mg-modal.show { display: flex; }
    .mg-modal-card {
      background: #fff; border-radius: 18px; padding: 24px 28px;
      max-width: 92%; min-width: 280px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .mg-modal-card h2 { margin: 0 0 8px; color: #1e40af; font-size: 1.5rem; }
    .mg-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .mg-stats-grid .cell { background: #dbeafe; padding: 10px; border-radius: 10px; }
    .mg-stats-grid .lbl { font-size: 10px; color: #1e40af; text-transform: uppercase; font-weight: 700; }
    .mg-stats-grid .val { font-size: 1.4rem; font-weight: 900; color: #1e293b; }
    .new-best {
      display: inline-block; background: #fde68a; color: #92400e;
      font-weight: 900; font-size: .8rem; padding: 3px 12px;
      border-radius: 99px; margin-bottom: 8px; box-shadow: 0 0 12px rgba(251,191,36,.5);
    }
    .mg-btn-modal {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: #fff; font-size: 1rem; font-weight: 800; letter-spacing: .5px;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 12px rgba(37,99,235,.35);
    }
    .mg-btn-modal:active { transform: translateY(2px); box-shadow: 0 2px 6px rgba(37,99,235,.35); }

    @media (max-width: 380px) {
      .mg-eq-num, .mg-eq-q { font-size: 2rem; }
      .mg-op { font-size: 2rem; }
      .mg-opt { font-size: 1.6rem; }
      .mg-stat .val { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="mg-wrap">
    <div class="mg-header">
      <div class="mg-title" id="hdr-title">➕➖ ບວກ-ລົບ</div>
      <a href="index.html" id="hdr-back">← ໜ້າຫຼັກ</a>
    </div>

    <div class="mg-hud">
      <div class="mg-stat"><div class="lbl" id="lbl-level">ລະດັບ</div><div class="val level" id="ui-level">1</div></div>
      <div class="mg-stat"><div class="lbl" id="lbl-score">ຄະແນນ</div><div class="val score" id="ui-score">0</div></div>
      <div class="mg-stat"><div class="lbl" id="lbl-lives">ຫົວໃຈ</div><div class="val lives" id="ui-lives">❤❤❤❤❤</div></div>
      <div class="mg-stat"><div class="lbl" id="lbl-best">ດີສຸດ</div><div class="val best" id="ui-best">0</div></div>
    </div>

    <div class="mg-eq" id="eq-card">
      <button class="mg-speak" id="btn-speak" aria-label="Pronounce">🔊</button>
      <div class="mg-eq-row" id="eq-row"></div>
    </div>

    <div class="mg-options" id="options"></div>
  </div>

  <div class="mg-flash" id="flash">ລະດັບ 2!</div>

  <div class="mg-modal" id="modal-over">
    <div class="mg-modal-card">
      <div class="new-best" id="newbest" style="display:none">⭐ NEW BEST!</div>
      <h2 id="over-title">ຈົບເກມ</h2>
      <div class="mg-stats-grid">
        <div class="cell">
          <div class="lbl" id="over-lbl-score">ຄະແນນ</div>
          <div class="val" id="over-score">0</div>
        </div>
        <div class="cell">
          <div class="lbl" id="over-lbl-level">ລະດັບ</div>
          <div class="val" id="over-level">1</div>
        </div>
      </div>
      <button class="mg-btn-modal" id="btn-again">▶ ຫຼິ້ນອີກ</button>
    </div>
  </div>

  <script src="js/math-game.js"></script>
</body>
</html>

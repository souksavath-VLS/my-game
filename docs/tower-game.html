<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เกมหอคอย · Stack Tower</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: linear-gradient(180deg, #93c5fd, #fbcfe8);
      font-family: 'Noto Sans Lao', 'Segoe UI', Tahoma, sans-serif;
      overflow: hidden; user-select: none; -webkit-user-select: none;
      touch-action: none; -webkit-tap-highlight-color: transparent;
    }
    #wrap { width: 100vw; height: 100vh; display: flex; flex-direction: column; }

    /* HUD */
    .hud {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px; background: rgba(255,255,255,0.75);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(255,255,255,0.6);
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      flex-shrink: 0;
    }
    .hud-block { display: flex; flex-direction: column; align-items: center; min-width: 48px; }
    .hud-label { font-size: 9px; color: #475569; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .hud-value { font-size: 18px; font-weight: 900; color: #1e293b; }
    .hud-value.score { color: #1d4ed8; }
    .hud-value.best { color: #b45309; }
    .hud-buttons { display: flex; gap: 6px; }
    .hud-btn {
      background: rgba(30,41,59,0.85); border: none; color: #fff;
      border-radius: 8px; padding: 4px 8px; cursor: pointer; font-size: 14px;
      min-width: 32px; height: 32px;
    }
    .hud-btn:active { transform: scale(.95); }

    /* Canvas stage */
    #stage { position: relative; flex-grow: 1; overflow: hidden; }
    #game { display: block; width: 100%; height: 100%; }

    /* Hint */
    .hint {
      position: absolute; left: 0; right: 0; bottom: 40px;
      text-align: center; font-size: 1.05rem; font-weight: 800;
      color: #1e293b;
      background: rgba(255,255,255,.7);
      padding: 8px; pointer-events: none;
      animation: fadeBlink 1.6s infinite;
    }
    @keyframes fadeBlink { 50% { opacity: 0.45; } }

    /* Combo popup */
    .combo {
      position: absolute; pointer-events: none;
      font-weight: 900; font-size: 1.6rem; color: #f59e0b;
      text-shadow: 0 2px 8px rgba(0,0,0,.4);
      opacity: 0;
    }
    .combo.show { animation: floatUp 1.1s ease-out; }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(.6); }
      30% { opacity: 1; transform: translateY(-30px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-90px) scale(1); }
    }

    /* Overlays */
    .overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(15,23,42,0.65); backdrop-filter: blur(4px); z-index: 10;
    }
    .panel {
      background: #fff; border-radius: 18px;
      padding: 24px 28px; min-width: 260px; max-width: 92%;
      text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .panel h1 { margin: 0 0 8px; font-size: 1.8rem; color: #1d4ed8; letter-spacing: 1px; }
    .panel .sub { font-size: .9rem; color: #64748b; margin-bottom: 14px; }
    .score-board { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .score-board .cell { background: #f1f5f9; border-radius: 10px; padding: 10px; }
    .score-board .lbl { font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: 700; }
    .score-board .val { font-size: 1.6rem; font-weight: 900; color: #1e293b; }
    .score-board .val.you { color: #1d4ed8; }
    .score-board .val.best { color: #b45309; }
    .big-btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff; font-size: 1.05rem; font-weight: 800; letter-spacing: .5px;
      cursor: pointer; box-shadow: 0 4px 14px rgba(37,99,235,.4);
    }
    .big-btn:active { transform: translateY(2px); box-shadow: 0 2px 6px rgba(37,99,235,.4); }
    .new-best {
      display: inline-block; background: #fde68a; color: #92400e;
      font-weight: 900; font-size: .8rem; padding: 3px 12px;
      border-radius: 99px; margin-bottom: 8px; box-shadow: 0 0 12px rgba(251,191,36,.5);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="hud">
      <div class="hud-block">
        <div class="hud-label" id="lbl-score">คะแนน</div>
        <div class="hud-value score" id="ui-score">0</div>
      </div>
      <div class="hud-block">
        <div class="hud-label" id="lbl-best">ดีที่สุด</div>
        <div class="hud-value best" id="ui-best">0</div>
      </div>
      <div class="hud-buttons">
        <a href="index.html" class="hud-btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center" id="btn-home">⌂</a>
        <button class="hud-btn" id="btn-mute" title="Mute">🔊</button>
      </div>
    </div>

    <div id="stage">
      <canvas id="game"></canvas>
      <div class="hint hidden" id="hint">👆 แตะหน้าจอเพื่อวาง</div>
      <div class="combo" id="combo">PERFECT!</div>

      <!-- Start screen -->
      <div class="overlay" id="overlay-start">
        <div class="panel">
          <h1 id="start-title">🏗️ STACK TOWER</h1>
          <p class="sub" id="start-sub">แตะเพื่อวาง · ทำให้ตรงกันให้ได้นานที่สุด</p>
          <div class="score-board hidden" id="start-stats">
            <div class="cell">
              <div class="lbl" id="start-lbl-best">ดีที่สุด</div>
              <div class="val best" id="start-best">0</div>
            </div>
            <div class="cell">
              <div class="lbl" id="start-lbl-played">เล่นทั้งหมด</div>
              <div class="val you" id="start-played">0</div>
            </div>
          </div>
          <button class="big-btn" id="btn-start" type="button">▶ START</button>
        </div>
      </div>

      <!-- Game over -->
      <div class="overlay hidden" id="overlay-over">
        <div class="panel">
          <div class="new-best hidden" id="newbest">⭐ NEW BEST!</div>
          <h1 id="over-title">GAME OVER</h1>
          <div class="score-board">
            <div class="cell">
              <div class="lbl" id="over-lbl-score">คะแนน</div>
              <div class="val you" id="over-score">0</div>
            </div>
            <div class="cell">
              <div class="lbl" id="over-lbl-best">ดีที่สุด</div>
              <div class="val best" id="over-best">0</div>
            </div>
          </div>
          <button class="big-btn" id="btn-restart" type="button">▶ เล่นใหม่</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/tower-game.js"></script>
</body>
</html>

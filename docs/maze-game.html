<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ເຂົາວົງກົດ · Maze</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: linear-gradient(180deg, #ccfbf1, #a7f3d0);
      font-family: 'Noto Sans Lao', 'Segoe UI', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      color: #1e293b;
      overscroll-behavior: none;
    }
    .mz-wrap { max-width: 480px; margin: 0 auto; padding: 8px; }

    .mz-header {
      background: linear-gradient(135deg, #14b8a6, #0f766e);
      color: #fff; padding: 14px 16px; border-radius: 14px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 12px rgba(20,184,166,0.35); margin-bottom: 10px;
    }
    .mz-title { font-size: 1.15rem; font-weight: 800; letter-spacing: .5px; }
    .mz-header a { color: #fff; text-decoration: none; background: rgba(255,255,255,.22);
                   padding: 6px 12px; border-radius: 20px; font-size: .85rem; }

    .mz-hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .mz-stat { background: #fff; border-radius: 10px; padding: 8px 4px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .mz-stat .lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .mz-stat .val { font-size: 18px; font-weight: 900; color: #1e293b; line-height: 1.1; }
    .mz-stat .val.level { color: #0f766e; }
    .mz-stat .val.score { color: #2563eb; }
    .mz-stat .val.moves { color: #f59e0b; }
    .mz-stat .val.best  { color: #b45309; }

    /* Canvas */
    .mz-canvas-wrap {
      background: #fff; border-radius: 16px; padding: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 10px;
      display: flex; justify-content: center; align-items: center;
    }
    #maze {
      display: block; width: 100%; height: auto; max-width: 100%;
      border-radius: 8px; touch-action: none;
    }

    /* D-pad */
    .mz-pad {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr; gap: 6px;
      width: 200px; height: 200px; margin: 0 auto 10px;
    }
    .mz-pad button {
      border: none; border-radius: 14px;
      background: linear-gradient(135deg, #14b8a6, #0f766e);
      color: #fff; font-size: 1.6rem; font-weight: 900;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 0 rgba(15,118,110,.4);
      transition: transform .08s;
    }
    .mz-pad button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(15,118,110,.4); }
    .mz-pad button:disabled { opacity: .25; }
    .pad-u { grid-column: 2; grid-row: 1; }
    .pad-l { grid-column: 1; grid-row: 2; }
    .pad-r { grid-column: 3; grid-row: 2; }
    .pad-d { grid-column: 2; grid-row: 3; }
    .pad-c { grid-column: 2; grid-row: 2;
             background: #fff; color: #0f766e; font-size: 1.4rem;
             box-shadow: 0 4px 0 rgba(0,0,0,.1); }

    /* Flash */
    .mz-flash {
      position: fixed; left: 50%; top: 35%; transform: translate(-50%, -50%) scale(.5);
      padding: 16px 28px; border-radius: 14px;
      background: linear-gradient(135deg, #14b8a6, #0f766e);
      color: #fff; font-size: 1.6rem; font-weight: 900;
      opacity: 0; pointer-events: none; z-index: 30;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }
    .mz-flash.show { animation: flashPop 1s ease-out; }
    @keyframes flashPop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
      30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      80%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }

    /* Modal */
    .mz-modal {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(15,23,42,0.7); backdrop-filter: blur(4px); z-index: 20;
    }
    .mz-modal.show { display: flex; }
    .mz-modal-card {
      background: #fff; border-radius: 18px; padding: 24px 28px;
      max-width: 92%; min-width: 280px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .mz-modal-card h2 { margin: 0 0 8px; color: #0f766e; font-size: 1.5rem; }
    .mz-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .mz-stats-grid .cell { background: #ccfbf1; padding: 10px; border-radius: 10px; }
    .mz-stats-grid .lbl { font-size: 10px; color: #0f766e; text-transform: uppercase; font-weight: 700; }
    .mz-stats-grid .val { font-size: 1.4rem; font-weight: 900; color: #1e293b; }
    .new-best {
      display: inline-block; background: #fde68a; color: #92400e;
      font-weight: 900; font-size: .8rem; padding: 3px 12px;
      border-radius: 99px; margin-bottom: 8px; box-shadow: 0 0 12px rgba(251,191,36,.5);
    }
    .mz-btn-modal {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #14b8a6, #0f766e);
      color: #fff; font-size: 1rem; font-weight: 800; letter-spacing: .5px;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 12px rgba(20,184,166,.35);
    }
    .mz-btn-modal:active { transform: translateY(2px); box-shadow: 0 2px 6px rgba(20,184,166,.35); }

    @media (max-width: 380px) {
      .mz-stat .val { font-size: 15px; }
      .mz-pad { width: 180px; height: 180px; }
      .mz-pad button { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="mz-wrap">
    <div class="mz-header">
      <div class="mz-title" id="hdr-title">🌀 ເຂົາວົງກົດ</div>
      <a href="index.html" id="hdr-back">← ໜ້າຫຼັກ</a>
    </div>

    <div class="mz-hud">
      <div class="mz-stat"><div class="lbl" id="lbl-level">ລະດັບ</div><div class="val level" id="ui-level">1</div></div>
      <div class="mz-stat"><div class="lbl" id="lbl-score">ຄະແນນ</div><div class="val score" id="ui-score">0</div></div>
      <div class="mz-stat"><div class="lbl" id="lbl-moves">ໂຕ້</div><div class="val moves" id="ui-moves">0</div></div>
      <div class="mz-stat"><div class="lbl" id="lbl-best">ດີສຸດ</div><div class="val best" id="ui-best">0</div></div>
    </div>

    <div class="mz-canvas-wrap">
      <canvas id="maze" width="360" height="360"></canvas>
    </div>

    <div class="mz-pad">
      <button class="pad-u" id="pad-u" aria-label="Up">▲</button>
      <button class="pad-l" id="pad-l" aria-label="Left">◀</button>
      <button class="pad-c" id="pad-c" aria-label="Restart" title="Restart">↺</button>
      <button class="pad-r" id="pad-r" aria-label="Right">▶</button>
      <button class="pad-d" id="pad-d" aria-label="Down">▼</button>
    </div>
  </div>

  <div class="mz-flash" id="flash">ລະດັບ 2!</div>

  <div class="mz-modal" id="modal-over">
    <div class="mz-modal-card">
      <div class="new-best" id="newbest" style="display:none">⭐ NEW BEST!</div>
      <h2 id="over-title">ຈົບເກມ</h2>
      <div class="mz-stats-grid">
        <div class="cell">
          <div class="lbl" id="over-lbl-score">ຄະແນນ</div>
          <div class="val" id="over-score">0</div>
        </div>
        <div class="cell">
          <div class="lbl" id="over-lbl-level">ລະດັບ</div>
          <div class="val" id="over-level">1</div>
        </div>
      </div>
      <button class="mz-btn-modal" id="btn-again">▶ ຫຼິ້ນອີກ</button>
    </div>
  </div>

  <script src="js/maze-game.js"></script>
</body>
</html>

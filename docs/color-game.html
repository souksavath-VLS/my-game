<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เลือกสี · Color Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: linear-gradient(180deg, #fef3c7, #ddd6fe);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }
    .cg-wrap { max-width: 480px; margin: 0 auto; padding: 8px; }

    .cg-header {
      background: linear-gradient(135deg, #ec4899, #be185d);
      color: #fff; padding: 14px 16px; border-radius: 14px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 12px rgba(236,72,153,0.3); margin-bottom: 10px;
    }
    .cg-title { font-size: 1.15rem; font-weight: 800; letter-spacing: .5px; }
    .cg-header a { color: #fff; text-decoration: none; background: rgba(255,255,255,.22);
                   padding: 6px 12px; border-radius: 20px; font-size: .85rem; }

    .cg-hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .cg-stat { background: #fff; border-radius: 10px; padding: 8px 4px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .cg-stat .lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .cg-stat .val { font-size: 18px; font-weight: 900; color: #1e293b; line-height: 1.1; }
    .cg-stat .val.level { color: #ec4899; }
    .cg-stat .val.score { color: #2563eb; }
    .cg-stat .val.lives { color: #ef4444; letter-spacing: 0; }
    .cg-stat .val.best { color: #b45309; }

    /* Target name card */
    .cg-target {
      background: #fff; border-radius: 16px; padding: 24px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 10px;
      text-align: center; position: relative;
    }
    .cg-target-lbl {
      font-size: 10px; color: #94a3b8; text-transform: uppercase;
      letter-spacing: 1px; font-weight: 700; margin-bottom: 8px;
    }
    .cg-target-name {
      font-size: 2.4rem; font-weight: 900; color: #1e293b;
      font-family: 'Noto Sans Lao', 'Segoe UI', sans-serif;
      line-height: 1.1;
    }
    .cg-speak {
      position: absolute; top: 12px; right: 12px;
      background: #fef3c7; border: 2px solid #f59e0b;
      width: 40px; height: 40px; border-radius: 50%;
      cursor: pointer; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
    }
    .cg-speak:active { transform: scale(.9); }

    /* Color buttons */
    .cg-buttons {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      margin-bottom: 10px;
    }
    .cg-btn {
      aspect-ratio: 1 / 1;
      border-radius: 18px; border: 4px solid rgba(0,0,0,.15);
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,.18), inset 0 -4px 0 rgba(0,0,0,.12);
      transition: transform .15s;
    }
    .cg-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.18), inset 0 -4px 0 rgba(0,0,0,.12); }
    .cg-btn.correct {
      animation: pop .4s;
      box-shadow: 0 6px 0 rgba(0,0,0,.18), inset 0 -4px 0 rgba(0,0,0,.12), 0 0 24px rgba(16,185,129,.6);
    }
    .cg-btn.wrong { animation: shake .4s; }
    .cg-btn.dim { opacity: .35; }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* Flash */
    .cg-flash {
      position: fixed; left: 50%; top: 35%; transform: translate(-50%, -50%) scale(.5);
      padding: 16px 28px; border-radius: 14px;
      background: linear-gradient(135deg, #ec4899, #be185d);
      color: #fff; font-size: 1.6rem; font-weight: 900;
      opacity: 0; pointer-events: none; z-index: 30;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }
    .cg-flash.show { animation: flashPop 1s ease-out; }
    @keyframes flashPop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
      30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      80%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }

    /* Modal */
    .cg-modal {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(15,23,42,0.7); backdrop-filter: blur(4px); z-index: 20;
    }
    .cg-modal.show { display: flex; }
    .cg-modal-card {
      background: #fff; border-radius: 18px; padding: 24px 28px;
      max-width: 92%; min-width: 280px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .cg-modal-card h2 { margin: 0 0 8px; color: #be185d; font-size: 1.5rem; }
    .cg-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .cg-stats-grid .cell { background: #fce7f3; padding: 10px; border-radius: 10px; }
    .cg-stats-grid .lbl { font-size: 10px; color: #be185d; text-transform: uppercase; font-weight: 700; }
    .cg-stats-grid .val { font-size: 1.4rem; font-weight: 900; color: #1e293b; }
    .new-best {
      display: inline-block; background: #fde68a; color: #92400e;
      font-weight: 900; font-size: .8rem; padding: 3px 12px;
      border-radius: 99px; margin-bottom: 8px; box-shadow: 0 0 12px rgba(251,191,36,.5);
    }
    .cg-btn-modal {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #ec4899, #be185d);
      color: #fff; font-size: 1rem; font-weight: 800; letter-spacing: .5px;
      cursor: pointer; box-shadow: 0 4px 12px rgba(236,72,153,.35);
    }
    .cg-btn-modal:active { transform: translateY(2px); box-shadow: 0 2px 6px rgba(236,72,153,.35); }

    @media (max-width: 380px) {
      .cg-target-name { font-size: 2rem; }
      .cg-stat .val { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="cg-wrap">
    <div class="cg-header">
      <div class="cg-title" id="hdr-title">🎨 เลือกสี</div>
      <a href="index.html" id="hdr-back">← หน้าหลัก</a>
    </div>

    <div class="cg-hud">
      <div class="cg-stat"><div class="lbl" id="lbl-level">เลเวล</div><div class="val level" id="ui-level">1</div></div>
      <div class="cg-stat"><div class="lbl" id="lbl-score">คะแนน</div><div class="val score" id="ui-score">0</div></div>
      <div class="cg-stat"><div class="lbl" id="lbl-lives">หัวใจ</div><div class="val lives" id="ui-lives">❤❤❤❤❤</div></div>
      <div class="cg-stat"><div class="lbl" id="lbl-best">ดีที่สุด</div><div class="val best" id="ui-best">0</div></div>
    </div>

    <div class="cg-target">
      <button class="cg-speak" id="btn-speak" aria-label="Pronounce">🔊</button>
      <div class="cg-target-lbl" id="target-lbl">เลือกสี</div>
      <div class="cg-target-name" id="target-name">แดง</div>
    </div>

    <div class="cg-buttons" id="buttons"></div>
  </div>

  <div class="cg-flash" id="flash">เลเวล 2!</div>

  <div class="cg-modal" id="modal-over">
    <div class="cg-modal-card">
      <div class="new-best" id="newbest" style="display:none">⭐ NEW BEST!</div>
      <h2 id="over-title">จบเกม</h2>
      <div class="cg-stats-grid">
        <div class="cell">
          <div class="lbl" id="over-lbl-score">คะแนน</div>
          <div class="val" id="over-score">0</div>
        </div>
        <div class="cell">
          <div class="lbl" id="over-lbl-level">เลเวล</div>
          <div class="val" id="over-level">1</div>
        </div>
      </div>
      <button class="cg-btn-modal" id="btn-again">▶ เล่นใหม่</button>
    </div>
  </div>

  <script src="js/tts.js"></script>
  <script src="js/color-game.js"></script>
</body>
</html>

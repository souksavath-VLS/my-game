<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ຕົວເລກລາວ · Lao Numerals</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: linear-gradient(180deg, #fef3c7, #fed7aa);
      font-family: 'Noto Sans Lao', 'Segoe UI', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      color: #1e293b;
    }
    .ln-wrap { max-width: 480px; margin: 0 auto; padding: 8px; }

    .ln-header {
      background: linear-gradient(135deg, #f59e0b, #c2410c);
      color: #fff; padding: 14px 16px; border-radius: 14px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 12px rgba(245,158,11,0.35); margin-bottom: 10px;
    }
    .ln-title { font-size: 1.15rem; font-weight: 800; letter-spacing: .5px; }
    .ln-header a { color: #fff; text-decoration: none; background: rgba(255,255,255,.22);
                   padding: 6px 12px; border-radius: 20px; font-size: .85rem; }

    /* Mode tabs */
    .ln-tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px;
      background: #fff; border-radius: 12px; padding: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .ln-tab {
      padding: 10px; border: none; border-radius: 9px;
      font-family: inherit; font-size: .92rem; font-weight: 800;
      background: transparent; color: #94a3b8; cursor: pointer;
      transition: all .15s;
    }
    .ln-tab.active {
      background: linear-gradient(135deg, #f59e0b, #c2410c);
      color: #fff; box-shadow: 0 2px 6px rgba(245,158,11,.4);
    }

    .ln-hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .ln-stat { background: #fff; border-radius: 10px; padding: 8px 4px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .ln-stat .lbl { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .ln-stat .val { font-size: 18px; font-weight: 900; color: #1e293b; line-height: 1.1; }
    .ln-stat .val.level { color: #f59e0b; }
    .ln-stat .val.score { color: #2563eb; }
    .ln-stat .val.lives { color: #ef4444; letter-spacing: 0; }
    .ln-stat .val.best  { color: #b45309; }

    /* Learn mode grid */
    .ln-learn-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
      margin-bottom: 10px;
    }
    .ln-card {
      background: #fff; border-radius: 14px; padding: 12px 6px;
      text-align: center; cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,.1), 0 0 0 2px rgba(245,158,11,.15) inset;
      transition: transform .12s;
      position: relative; overflow: hidden;
    }
    .ln-card::before {
      content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px;
      background: linear-gradient(90deg, #f59e0b, #c2410c);
    }
    .ln-card:active { transform: translateY(2px) scale(.96); box-shadow: 0 1px 0 rgba(0,0,0,.1); }
    .ln-card .lao  {
      font-size: 2.4rem; font-weight: 900; color: #c2410c;
      line-height: 1; margin-top: 6px;
    }
    .ln-card .arab { font-size: 1.1rem; font-weight: 900; color: #1e293b; margin-top: 4px; }
    .ln-card .name { font-size: .68rem; font-weight: 700; color: #64748b; margin-top: 2px; }

    /* Quiz mode target */
    .ln-target {
      background: #fff; border-radius: 16px; padding: 24px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 10px;
      text-align: center; position: relative;
    }
    .ln-target-lbl {
      font-size: 10px; color: #94a3b8; text-transform: uppercase;
      letter-spacing: 1px; font-weight: 700; margin-bottom: 8px;
    }
    .ln-target-val {
      font-size: 4.2rem; font-weight: 900;
      line-height: 1; color: #c2410c;
    }
    .ln-target-val.arab { color: #2563eb; }
    .ln-speak {
      position: absolute; top: 12px; right: 12px;
      background: #fef3c7; border: 2px solid #f59e0b;
      width: 40px; height: 40px; border-radius: 50%;
      cursor: pointer; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
    }
    .ln-speak:active { transform: scale(.9); }

    .ln-options {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
      margin-bottom: 10px;
    }
    .ln-opt {
      aspect-ratio: 2 / 1;
      background: #fff; border: 3px solid rgba(0,0,0,.08); border-radius: 14px;
      font-size: 2rem; font-weight: 900; color: #1e293b;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 0 rgba(0,0,0,.1);
      transition: transform .12s;
    }
    .ln-opt.lao  { color: #c2410c; font-size: 2.4rem; }
    .ln-opt.arab { color: #2563eb; }
    .ln-opt:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.1); }
    .ln-opt.correct {
      background: #d1fae5; border-color: #10b981; color: #065f46;
      animation: pop .4s;
    }
    .ln-opt.wrong {
      background: #fee2e2; border-color: #ef4444; color: #991b1b;
      animation: shake .4s;
    }
    .ln-opt.dim { opacity: .35; }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

    /* Flash */
    .ln-flash {
      position: fixed; left: 50%; top: 35%; transform: translate(-50%, -50%) scale(.5);
      padding: 16px 28px; border-radius: 14px;
      background: linear-gradient(135deg, #f59e0b, #c2410c);
      color: #fff; font-size: 1.6rem; font-weight: 900;
      opacity: 0; pointer-events: none; z-index: 30;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }
    .ln-flash.show { animation: flashPop 1s ease-out; }
    @keyframes flashPop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
      30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      80%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }

    /* Modal */
    .ln-modal {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(15,23,42,0.7); backdrop-filter: blur(4px); z-index: 20;
    }
    .ln-modal.show { display: flex; }
    .ln-modal-card {
      background: #fff; border-radius: 18px; padding: 24px 28px;
      max-width: 92%; min-width: 280px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }
    .ln-modal-card h2 { margin: 0 0 8px; color: #c2410c; font-size: 1.5rem; }
    .ln-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .ln-stats-grid .cell { background: #fef3c7; padding: 10px; border-radius: 10px; }
    .ln-stats-grid .lbl { font-size: 10px; color: #c2410c; text-transform: uppercase; font-weight: 700; }
    .ln-stats-grid .val { font-size: 1.4rem; font-weight: 900; color: #1e293b; }
    .new-best {
      display: inline-block; background: #fde68a; color: #92400e;
      font-weight: 900; font-size: .8rem; padding: 3px 12px;
      border-radius: 99px; margin-bottom: 8px; box-shadow: 0 0 12px rgba(251,191,36,.5);
    }
    .ln-btn-modal {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #f59e0b, #c2410c);
      color: #fff; font-size: 1rem; font-weight: 800; letter-spacing: .5px;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 12px rgba(245,158,11,.35);
    }
    .ln-btn-modal:active { transform: translateY(2px); box-shadow: 0 2px 6px rgba(245,158,11,.35); }

    @media (max-width: 380px) {
      .ln-card .lao { font-size: 2rem; }
      .ln-card .arab { font-size: 1rem; }
      .ln-target-val { font-size: 3.4rem; }
      .ln-opt { font-size: 1.6rem; }
      .ln-opt.lao { font-size: 2rem; }
      .ln-stat .val { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="ln-wrap">
    <div class="ln-header">
      <div class="ln-title" id="hdr-title">໐໑໒ ຕົວເລກລາວ</div>
      <a href="index.html" id="hdr-back">← ໜ້າຫຼັກ</a>
    </div>

    <div class="ln-tabs">
      <button class="ln-tab active" id="tab-learn" data-mode="learn">📚 <span id="tab-learn-lbl">ຮຽນຮູ້</span></button>
      <button class="ln-tab"        id="tab-quiz"  data-mode="quiz">🎯 <span id="tab-quiz-lbl">ຄຳຖາມ</span></button>
    </div>

    <div class="ln-hud" id="hud">
      <div class="ln-stat"><div class="lbl" id="lbl-level">ລະດັບ</div><div class="val level" id="ui-level">1</div></div>
      <div class="ln-stat"><div class="lbl" id="lbl-score">ຄະແນນ</div><div class="val score" id="ui-score">0</div></div>
      <div class="ln-stat"><div class="lbl" id="lbl-lives">ຫົວໃຈ</div><div class="val lives" id="ui-lives">❤❤❤❤❤</div></div>
      <div class="ln-stat"><div class="lbl" id="lbl-best">ດີສຸດ</div><div class="val best" id="ui-best">0</div></div>
    </div>

    <!-- Learn mode -->
    <div id="learn-view">
      <div class="ln-learn-grid" id="learn-grid"></div>
    </div>

    <!-- Quiz mode -->
    <div id="quiz-view" style="display:none;">
      <div class="ln-target">
        <button class="ln-speak" id="btn-speak" aria-label="Pronounce">🔊</button>
        <div class="ln-target-lbl" id="target-lbl">ເລືອກຄຳຕອບທີ່ຖືກ</div>
        <div class="ln-target-val" id="target-val">໑</div>
      </div>
      <div class="ln-options" id="options"></div>
    </div>
  </div>

  <div class="ln-flash" id="flash">ລະດັບ 2!</div>

  <div class="ln-modal" id="modal-over">
    <div class="ln-modal-card">
      <div class="new-best" id="newbest" style="display:none">⭐ NEW BEST!</div>
      <h2 id="over-title">ຈົບເກມ</h2>
      <div class="ln-stats-grid">
        <div class="cell">
          <div class="lbl" id="over-lbl-score">ຄະແນນ</div>
          <div class="val" id="over-score">0</div>
        </div>
        <div class="cell">
          <div class="lbl" id="over-lbl-level">ລະດັບ</div>
          <div class="val" id="over-level">1</div>
        </div>
      </div>
      <button class="ln-btn-modal" id="btn-again">▶ ຫຼິ້ນອີກ</button>
    </div>
  </div>

  <script src="js/tts.js"></script>
  <script src="js/lao-number-game.js"></script>
</body>
</html>
